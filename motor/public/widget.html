<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chat</title>
<style>
  :root { --color: #2563eb; --fondo: #efe7de; --cliente: #d9fdd3; --agente: #fff; --texto: #111; --suave: #667; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; height: 100dvh; }
  header { background: var(--color); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  header .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 800; }
  header b { display: block; } header small { opacity: .85; font-size: 12px; }
  header button { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 24px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  #charla { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 85%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px #0002; }
  .cliente { align-self: flex-end; background: var(--cliente); border-top-right-radius: 2px; }
  .agente { align-self: flex-start; background: var(--agente); border-top-left-radius: 2px; }
  .humano { border-left: 3px solid var(--color); }
  .humano::before { content: "Equipo"; display: block; font-size: 11px; font-weight: 700; color: var(--color); margin-bottom: 2px; }
  .msg a { color: #0b57d0; }
  .aviso { align-self: center; font-size: 12px; color: var(--suave); text-align: center; max-width: 92%; background: rgba(255,255,255,.6); padding: 4px 10px; border-radius: 8px; }
  .escribiendo { align-self: flex-start; color: var(--suave); font-size: 13px; padding: 4px 8px; }
  form { display: flex; gap: 8px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: #f0f0f0; border-top: 1px solid #ddd; }
  form input { flex: 1; min-width: 0; border: 1px solid #ddd; border-radius: 20px; padding: 10px 14px; font: inherit; background: #fff; }
  form button { border: 0; border-radius: 50%; width: 42px; height: 42px; flex: none; cursor: pointer; background: var(--color); color: #fff; font-size: 18px; }
  form button.secundario { background: #fff; color: #444; border: 1px solid #ddd; }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div class="avatar" id="avatar">·</div>
  <div><b id="titulo">Chat</b><small>Asistente automático · respondemos al toque</small></div>
  <button type="button" id="cerrar" aria-label="Cerrar">×</button>
</header>
<main id="charla" aria-live="polite"></main>
<form id="form">
  <button class="secundario" id="ubic" type="button" title="Mandar mi ubicación" aria-label="Mandar mi ubicación">📍</button>
  <input id="texto" autocomplete="off" placeholder="Escribí un mensaje" aria-label="Mensaje" maxlength="1000">
  <button id="enviar" type="submit" aria-label="Enviar">➤</button>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  const ficha = (new URLSearchParams(location.search).get("ficha") || "").replace(/[^a-z0-9-]/g, "");
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const nueva = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
  const claveSesion = "burbuja-" + ficha;
  let sesion = leer(claveSesion) || nueva();
  guardar(claveSesion, sesion);
  const historialKey = "burbuja-historial-" + ficha;

  function burbuja(texto, clase, guardarla = true) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    const seguro = texto.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    d.innerHTML = seguro.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
    $("charla").append(d);
    $("charla").scrollTop = $("charla").scrollHeight;
    if (guardarla) {
      // La charla se ve igual si la persona cierra y vuelve a abrir (solo en este navegador).
      try {
        const h = JSON.parse(sessionStorage.getItem(historialKey) || "[]");
        h.push([texto, clase]);
        sessionStorage.setItem(historialKey, JSON.stringify(h.slice(-60)));
      } catch {}
    }
  }
  function aviso(t) { const d = document.createElement("div"); d.className = "aviso"; d.textContent = t; $("charla").append(d); $("charla").scrollTop = 1e9; }

  // La web puede contar dónde está la persona (rol, pestaña): se le pregunta a la burbuja, con poca espera.
  function pedirContexto() {
    return new Promise((ok) => {
      if (parent === window) return ok({});
      const fin = setTimeout(() => { removeEventListener("message", oir); ok({}); }, 2500);
      function oir(e) {
        if (e.source !== parent || e.data?.ba !== "contexto" || e.data.ficha !== ficha) return;
        clearTimeout(fin); removeEventListener("message", oir); ok({ contexto: String(e.data.contexto || ""), credencial: String(e.data.credencial || "") });
      }
      addEventListener("message", oir);
      parent.postMessage("ba-contexto:" + ficha, "*");
    });
  }

  async function mandar(texto) {
    burbuja(texto.startsWith("[Ubicación") ? "📍 Ubicación compartida" : texto, "cliente");
    $("enviar").disabled = true;
    const esc = document.createElement("div"); esc.className = "escribiendo"; esc.textContent = "escribiendo…"; $("charla").append(esc); $("charla").scrollTop = 1e9;
    try {
      const { contexto = "", credencial = "" } = await pedirContexto();
      const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ publico: true, ficha, sesion, texto, contexto, credencial }) });
      const j = await r.json().catch(() => ({}));
      esc.remove();
      if (j.respuestas?.length) j.respuestas.forEach((t) => burbuja(t, "agente"));
      else if (!r.ok) aviso(j.error || "No pudimos conectar. Probá de nuevo.");
      else aviso("Una persona del equipo va a seguir esta charla.");
    } catch { esc.remove(); aviso("No pudimos conectar. Probá de nuevo."); }
    $("enviar").disabled = false; $("texto").focus();
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("texto").value.trim(); if (!t) return; $("texto").value = ""; mandar(t); });
  $("cerrar").onclick = () => parent.postMessage("ba-cerrar:" + ficha, "*");
  $("ubic").onclick = () => {
    if (!navigator.geolocation) return aviso("Tu navegador no comparte la ubicación. Escribí tu dirección.");
    navigator.geolocation.getCurrentPosition(
      (p) => mandar(`[Ubicación compartida: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}]`),
      () => aviso("No pudimos leer tu ubicación. Escribí tu dirección con calle y número."),
      { enableHighAccuracy: true, timeout: 10000 },
    );
  };

  // Respuestas de una persona del equipo: se buscan cada 6 segundos mientras el chat está a la vista.
  const claveDesde = "burbuja-desde-" + ficha;
  let desde = (() => { try { return sessionStorage.getItem(claveDesde) || ""; } catch { return ""; } })();
  async function novedades() {
    if (document.hidden) return;
    try {
      const r = await fetch(`/api/chat?novedades=1&ficha=${ficha}&sesion=${sesion}&desde=${encodeURIComponent(desde)}`);
      const j = await r.json();
      for (const m of j.mensajes || []) {
        burbuja(m.texto, "agente humano");
        desde = m.creado;
        try { sessionStorage.setItem(claveDesde, desde); } catch {}
      }
    } catch {}
  }
  setInterval(novedades, 6000);

  fetch("/api/chat?config=" + ficha).then((r) => r.json()).then((cfg) => {
    if (!cfg.activo) { aviso("El chat no está disponible en este momento."); $("enviar").disabled = true; return; }
    if (!cfg.ubicacion) $("ubic").remove();
    if (/^#[0-9a-f]{3,8}$/i.test(cfg.color || "")) document.documentElement.style.setProperty("--color", cfg.color);
    $("titulo").textContent = cfg.agente; $("avatar").textContent = (cfg.agente || "·")[0]; document.title = "Chat con " + cfg.agente;
    let h = [];
    try { h = JSON.parse(sessionStorage.getItem(historialKey) || "[]"); } catch {}
    if (h.length) h.forEach(([t, c]) => burbuja(t, c, false));
    else if (cfg.saludo) burbuja(cfg.saludo, "agente");
  }).catch(() => aviso("No pudimos conectar."));
  $("texto").focus();
</script>
</body>
</html>
