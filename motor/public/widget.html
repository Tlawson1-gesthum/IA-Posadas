<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chat</title>
<style>
  :root { --color: #2563eb; --fondo: #efe7de; --cliente: #d9fdd3; --agente: #fff; --texto: #111; --suave: #667; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; height: 100dvh; }
  header { background: var(--color); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  header .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 800; }
  header b { display: block; } header small { opacity: .85; font-size: 12px; }
  header button { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 24px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  #charla { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 85%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px #0002; }
  .cliente { align-self: flex-end; background: var(--cliente); border-top-right-radius: 2px; }
  .agente { align-self: flex-start; background: var(--agente); border-top-left-radius: 2px; }
  .humano { border-left: 3px solid var(--color); }
  .humano::before { content: "Equipo"; display: block; font-size: 11px; font-weight: 700; color: var(--color); margin-bottom: 2px; }
  .msg a { color: #0b57d0; }
  .aviso { align-self: center; font-size: 12px; color: var(--suave); text-align: center; max-width: 92%; background: rgba(255,255,255,.6); padding: 4px 10px; border-radius: 8px; }
  .escribiendo { align-self: flex-start; color: var(--suave); font-size: 13px; padding: 4px 8px; }
  form { display: flex; gap: 8px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: #f0f0f0; border-top: 1px solid #ddd; }
  form input { flex: 1; min-width: 0; border: 1px solid #ddd; border-radius: 20px; padding: 10px 14px; font: inherit; background: #fff; }
  form button { border: 0; border-radius: 50%; width: 42px; height: 42px; flex: none; cursor: pointer; background: var(--color); color: #fff; font-size: 18px; }
  form button.secundario { background: #fff; color: #444; border: 1px solid #ddd; }
  form button:disabled { opacity: .5; }
  [hidden] { display: none !important; }
  .solo-pensa { display: none; }

  /* Estilo Pensa (?tema=pensa): la ayuda del panel de los locales. Ventana blanca, mensajes redondeados y la caja de
     escribir con borde, como los chats de soporte de los sistemas de gestión. Colores y letra del manual de marca de Pensa. */
  html.pensa { --color: #6B1A26; --texto: #131112; --suave: #6B6A67; --linea: #CFCDC8; --claro: #F2F1EE; }
  html.pensa body { font: 15px/1.45 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; }
  html.pensa .solo-pensa { display: grid; }
  html.pensa header { position: relative; background: #fff; color: var(--texto); padding: 12px 10px 12px 16px; border-bottom: 1px solid var(--claro); }
  html.pensa header .avatar { width: 36px; height: 36px; background: none; flex: none; }
  html.pensa header .avatar svg { width: 100%; height: 100%; display: block; }
  html.pensa header b { font-weight: 600; font-size: 16px; }
  html.pensa header small { color: var(--suave); opacity: 1; font-size: 13px; }
  html.pensa header button { margin-left: 0; width: 36px; height: 36px; padding: 0; border-radius: 50%; color: var(--suave); display: grid; place-items: center; transition: background .15s; }
  html.pensa header button:hover { background: var(--claro); }
  html.pensa header button svg { width: 20px; height: 20px; }
  html.pensa header #menu { margin-left: auto; }
  html.pensa #opciones { position: absolute; top: 54px; right: 50px; z-index: 2; background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 6px; min-width: 220px; }
  html.pensa #opciones button { width: 100%; height: auto; border-radius: 8px; padding: 10px 12px; text-align: left; font: inherit; font-size: 14px; color: var(--texto); }
  html.pensa #charla { padding: 16px; gap: 8px; }
  html.pensa .msg { box-shadow: none; border-radius: 18px; padding: 9px 13px; max-width: 82%; }
  html.pensa .agente { background: var(--claro); border-bottom-left-radius: 4px; border-top-left-radius: 18px; }
  html.pensa .cliente { background: var(--color); color: var(--claro); border-bottom-right-radius: 4px; border-top-right-radius: 18px; }
  html.pensa .cliente a { color: inherit; }
  html.pensa .humano { border-left: 0; }
  html.pensa .humano::before { content: "Equipo Pensa"; }
  html.pensa .aviso { background: none; font-size: 13px; }
  html.pensa .escribiendo { font-size: 13px; padding: 4px 2px; }
  html.pensa form { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "texto texto" "ubic enviar"; gap: 4px;
    margin: 0 16px calc(16px + env(safe-area-inset-bottom)); padding: 10px 10px 10px 16px; background: #fff;
    border: 1px solid var(--linea); border-radius: 18px; transition: border-color .15s; }
  html.pensa form:focus-within { border-color: var(--suave); }
  html.pensa form input { grid-area: texto; border: 0; border-radius: 0; padding: 4px 0 8px; outline: none; font-size: 15px; color: var(--texto); }
  html.pensa form input::placeholder { color: var(--suave); }
  html.pensa #ubic { grid-area: ubic; justify-self: start; width: 34px; height: 34px; background: none; border: 0; }
  html.pensa #enviar { grid-area: enviar; width: 34px; height: 34px; display: grid; place-items: center; background: #E6E4E0; color: #8E8884; transition: background .15s, color .15s; }
  html.pensa #enviar.listo { background: var(--color); color: var(--claro); }
  html.pensa #enviar svg { width: 18px; height: 18px; }
  html.pensa #enviar:disabled { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { html.pensa * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="avatar" id="avatar">·</div>
  <div><b id="titulo">Chat</b><small id="sub">Asistente automático · respondemos al toque</small></div>
  <button type="button" id="menu" class="solo-pensa" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false">···</button>
  <button type="button" id="cerrar" aria-label="Cerrar">×</button>
  <div id="opciones" role="menu" hidden><button type="button" id="nueva" role="menuitem">Empezar una charla nueva</button></div>
</header>
<main id="charla" aria-live="polite"></main>
<form id="form">
  <button class="secundario" id="ubic" type="button" title="Mandar mi ubicación" aria-label="Mandar mi ubicación">📍</button>
  <input id="texto" autocomplete="off" placeholder="Escribí un mensaje" aria-label="Mensaje" maxlength="1000">
  <button id="enviar" type="submit" aria-label="Enviar">➤</button>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  const ficha = (new URLSearchParams(location.search).get("ficha") || "").replace(/[^a-z0-9-]/g, "");
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const nueva = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
  const claveSesion = "burbuja-" + ficha;
  let sesion = leer(claveSesion) || nueva();
  guardar(claveSesion, sesion);
  const historialKey = "burbuja-historial-" + ficha;
  // ?tema=pensa: la ayuda del panel de los locales, con la marca de Pensa (el color de la ficha no se usa).
  const pensa = new URLSearchParams(location.search).get("tema") === "pensa";
  if (pensa) {
    document.documentElement.classList.add("pensa");
    const fuente = document.createElement("link");
    fuente.rel = "stylesheet";
    fuente.href = "https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap";
    document.head.append(fuente);
    $("avatar").innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-134.5 -12 260 260" color="#F2F1EE" aria-hidden="true"><circle cx="-4.5" cy="118" r="130" fill="#6B1A26"/><g transform="translate(-4.5 118) scale(.76) translate(4.5 -118)"><g fill="none" stroke="currentColor" stroke-width="11"><path d="M-110 50C-70 50 -50 90 -20 90"/><path d="M-110 90H-20"/><path d="M-110 130C-70 130 -50 90 -20 90"/><path d="M-20 90H2.5"/><circle cx="50.5" cy="90" r="48"/><path d="M2.5 40V196"/></g></g></svg>';
    $("menu").innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
    $("cerrar").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    $("enviar").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    $("texto").placeholder = "Escribí un mensaje…";
    $("sub").textContent = "Ayuda del sistema";
    // El botón de mandar se enciende cuando hay algo escrito
    const encender = () => $("enviar").classList.toggle("listo", !!$("texto").value.trim());
    $("texto").addEventListener("input", encender);
    $("form").addEventListener("submit", () => setTimeout(encender));
    // ··· → Empezar una charla nueva (borra lo que se ve en este navegador y arranca otra sesión)
    const menu = (abrir) => { $("opciones").hidden = !abrir; $("menu").setAttribute("aria-expanded", String(abrir)); };
    $("menu").onclick = (e) => { e.stopPropagation(); menu($("opciones").hidden); };
    document.addEventListener("click", (e) => { if (!$("opciones").contains(e.target)) menu(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") menu(false); });
    $("nueva").onclick = () => {
      menu(false);
      try { sessionStorage.removeItem(historialKey); sessionStorage.removeItem("burbuja-desde-" + ficha); } catch {}
      sesion = nueva(); guardar(claveSesion, sesion); desde = "";
      $("charla").replaceChildren();
      if (saludo) burbuja(saludo, "agente");
      $("texto").focus();
    };
  }
  let saludo = "";

  function burbuja(texto, clase, guardarla = true) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    const seguro = texto.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    d.innerHTML = seguro.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
    $("charla").append(d);
    $("charla").scrollTop = $("charla").scrollHeight;
    if (guardarla) {
      // La charla se ve igual si la persona cierra y vuelve a abrir (solo en este navegador).
      try {
        const h = JSON.parse(sessionStorage.getItem(historialKey) || "[]");
        h.push([texto, clase]);
        sessionStorage.setItem(historialKey, JSON.stringify(h.slice(-60)));
      } catch {}
    }
  }
  function aviso(t) { const d = document.createElement("div"); d.className = "aviso"; d.textContent = t; $("charla").append(d); $("charla").scrollTop = 1e9; }

  // La web puede contar dónde está la persona (rol, pestaña): se le pregunta a la burbuja, con poca espera.
  function pedirContexto() {
    return new Promise((ok) => {
      if (parent === window) return ok({});
      const fin = setTimeout(() => { removeEventListener("message", oir); ok({}); }, 2500);
      function oir(e) {
        if (e.source !== parent || e.data?.ba !== "contexto" || e.data.ficha !== ficha) return;
        clearTimeout(fin); removeEventListener("message", oir); ok({ contexto: String(e.data.contexto || ""), credencial: String(e.data.credencial || "") });
      }
      addEventListener("message", oir);
      parent.postMessage("ba-contexto:" + ficha, "*");
    });
  }

  async function mandar(texto) {
    burbuja(texto.startsWith("[Ubicación") ? "📍 Ubicación compartida" : texto, "cliente");
    $("enviar").disabled = true;
    const esc = document.createElement("div"); esc.className = "escribiendo"; esc.textContent = "escribiendo…"; $("charla").append(esc); $("charla").scrollTop = 1e9;
    try {
      const { contexto = "", credencial = "" } = await pedirContexto();
      const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ publico: true, ficha, sesion, texto, contexto, credencial }) });
      const j = await r.json().catch(() => ({}));
      esc.remove();
      if (j.respuestas?.length) j.respuestas.forEach((t) => burbuja(t, "agente"));
      else if (!r.ok) aviso(j.error || "No pudimos conectar. Probá de nuevo.");
      else aviso("Una persona del equipo va a seguir esta charla.");
    } catch { esc.remove(); aviso("No pudimos conectar. Probá de nuevo."); }
    $("enviar").disabled = false; $("texto").focus();
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("texto").value.trim(); if (!t) return; $("texto").value = ""; mandar(t); });
  $("cerrar").onclick = () => parent.postMessage("ba-cerrar:" + ficha, "*");
  $("ubic").onclick = () => {
    if (!navigator.geolocation) return aviso("Tu navegador no comparte la ubicación. Escribí tu dirección.");
    navigator.geolocation.getCurrentPosition(
      (p) => mandar(`[Ubicación compartida: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}]`),
      () => aviso("No pudimos leer tu ubicación. Escribí tu dirección con calle y número."),
      { enableHighAccuracy: true, timeout: 10000 },
    );
  };

  // Respuestas de una persona del equipo: se buscan cada 6 segundos mientras el chat está a la vista.
  const claveDesde = "burbuja-desde-" + ficha;
  let desde = (() => { try { return sessionStorage.getItem(claveDesde) || ""; } catch { return ""; } })();
  async function novedades() {
    if (document.hidden) return;
    try {
      const r = await fetch(`/api/chat?novedades=1&ficha=${ficha}&sesion=${sesion}&desde=${encodeURIComponent(desde)}`);
      const j = await r.json();
      for (const m of j.mensajes || []) {
        burbuja(m.texto, "agente humano");
        desde = m.creado;
        try { sessionStorage.setItem(claveDesde, desde); } catch {}
      }
    } catch {}
  }
  setInterval(novedades, 6000);

  fetch("/api/chat?config=" + ficha).then((r) => r.json()).then((cfg) => {
    if (!cfg.activo) { aviso("El chat no está disponible en este momento."); $("enviar").disabled = true; return; }
    if (!cfg.ubicacion) $("ubic").remove();
    saludo = cfg.saludo || "";
    if (pensa) { $("titulo").textContent = "Pensa"; document.title = "Ayuda de Pensa"; }
    else {
      if (/^#[0-9a-f]{3,8}$/i.test(cfg.color || "")) document.documentElement.style.setProperty("--color", cfg.color);
      $("titulo").textContent = cfg.agente; $("avatar").textContent = (cfg.agente || "·")[0]; document.title = "Chat con " + cfg.agente;
    }
    let h = [];
    try { h = JSON.parse(sessionStorage.getItem(historialKey) || "[]"); } catch {}
    if (h.length) h.forEach(([t, c]) => burbuja(t, c, false));
    else if (cfg.saludo) burbuja(cfg.saludo, "agente");
  }).catch(() => aviso("No pudimos conectar."));
  $("texto").focus();
</script>
</body>
</html>
