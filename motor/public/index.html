<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat de prueba</title>
<style>
  :root {
    --fondo: #efe7de; --barra: #1f1f1f; --texto: #111; --suave: #667;
    --cliente: #d9fdd3; --agente: #ffffff; --acento: #e2231a; --borde: #ddd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #0b141a; --barra: #202c33; --texto: #e9edef; --suave: #8696a0;
      --cliente: #005c4b; --agente: #202c33; --borde: #2a3942; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; height: 100dvh; }
  header { background: var(--barra); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--acento); display: grid; place-items: center; font-weight: 800; }
  header b { display: block; } header small { opacity: .75; }
  header button { margin-left: auto; background: transparent; color: #fff; border: 1px solid #ffffff55; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #charla { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px #0002; }
  .cliente { align-self: flex-end; background: var(--cliente); border-top-right-radius: 2px; }
  .agente { align-self: flex-start; background: var(--agente); border-top-left-radius: 2px; }
  .aviso { align-self: center; font-size: 13px; color: var(--suave); text-align: center; max-width: 90%; }
  .msg a { color: inherit; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--barra); }
  form input { flex: 1; min-width: 0; border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; background: var(--agente); color: var(--texto); }
  form button { border: 0; border-radius: 20px; padding: 0 14px; font: inherit; cursor: pointer; background: var(--acento); color: #fff; }
  form button.secundario { background: transparent; color: #fff; border: 1px solid #ffffff55; padding: 0 10px; }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div class="avatar" id="avatar">·</div>
  <div><b id="titulo">Chat de prueba</b><small id="estado">chat de prueba</small></div>
  <button id="nueva" type="button" title="Empezar una charla nueva, sin memoria">Nueva charla</button>
</header>
<main id="charla" aria-live="polite"></main>
<form id="form">
  <button class="secundario" id="ubic" type="button" title="Mandar mi ubicación">📍</button>
  <input id="texto" autocomplete="off" placeholder="Escribí un mensaje" aria-label="Mensaje">
  <button id="enviar" type="submit">Enviar</button>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const nuevaSesion = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36);

  const params = new URLSearchParams(location.search);
  const ficha = (params.get("ficha") || "").replace(/[^a-z0-9-]/g, "");
  const borrador = params.get("borrador") === "1";
  const claveSesion = "chat-sesion-" + (ficha || "def") + (borrador ? "-b" : "");
  let clave = leer("chat-clave") || "";
  let sesion = leer(claveSesion) || nuevaSesion();
  guardar(claveSesion, sesion);
  const estadoBase = borrador ? "probando el BORRADOR (sin publicar)" : "chat de prueba";
  $("estado").textContent = estadoBase;

  function burbuja(texto, clase) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    // Links clickeables y *negrita* como en WhatsApp, sin interpretar HTML.
    const seguro = texto.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    d.innerHTML = seguro
      .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
    $("charla").append(d);
    $("charla").scrollTop = $("charla").scrollHeight;
  }
  function aviso(texto) {
    const d = document.createElement("div");
    d.className = "aviso"; d.textContent = texto;
    $("charla").append(d);
  }

  async function mandar(texto) {
    if (!clave && !borrador) {
      clave = prompt("Clave del chat de prueba (CHAT_CLAVE en Vercel). Si entraste al panel, dejalo vacío:") || "";
      guardar("chat-clave", clave);
    }
    burbuja(texto.startsWith("[Ubicación") ? "📍 Ubicación compartida" : texto, "cliente");
    $("enviar").disabled = true; $("estado").textContent = "escribiendo…";
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ clave, sesion, texto, ficha, borrador }) });
      const j = await r.json().catch(() => ({}));
      if (j.ficha) {
        $("titulo").textContent = (j.ficha.agente ? j.ficha.agente + " · " : "") + j.ficha.nombre;
        $("avatar").textContent = (j.ficha.agente || j.ficha.nombre)[0];
        document.title = $("titulo").textContent;
      }
      if (r.status === 403) { clave = ""; guardar("chat-clave", ""); aviso(j.error || "Clave incorrecta. Probá de nuevo."); }
      else if (!r.ok) aviso("Error: " + (j.error || r.status));
      else if (!j.respuestas.length) aviso("(El agente no responde: la charla está derivada a una persona o el agente está pausado. Escribí /reiniciar o tocá «Nueva charla».)");
      else j.respuestas.forEach((t) => burbuja(t, "agente"));
    } catch (e) { aviso("No se pudo conectar: " + e.message); }
    $("enviar").disabled = false; $("estado").textContent = estadoBase; $("texto").focus();
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("texto").value.trim();
    if (!t) return;
    $("texto").value = "";
    mandar(t);
  });
  $("ubic").addEventListener("click", () => {
    if (!navigator.geolocation) return aviso("Este navegador no comparte ubicación.");
    navigator.geolocation.getCurrentPosition(
      (p) => mandar(`[Ubicación compartida: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}]`),
      () => {
        const t = prompt("No pude leer tu ubicación. Escribí latitud y longitud (ej: -27.37, -55.90):");
        const m = t && t.match(/(-?\d+(?:\.\d+)?)[\s,]+(-?\d+(?:\.\d+)?)/);
        if (m) mandar(`[Ubicación compartida: ${m[1]}, ${m[2]}]`);
      },
      { enableHighAccuracy: true, timeout: 10000 },
    );
  });
  $("nueva").addEventListener("click", () => {
    sesion = nuevaSesion(); guardar(claveSesion, sesion);
    $("charla").innerHTML = ""; aviso("Charla nueva. El agente no recuerda lo anterior.");
  });
  aviso(borrador ? "Probando los cambios sin publicar. Los clientes reales siguen con la versión publicada." : "Chat de prueba. Si el agente toma pedidos, revisá en su ficha si están simulados.");
  $("texto").focus();
</script>
</body>
</html>
