<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat de prueba · Pensa</title>
<link rel="icon" href="/marca/avatar.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pensa.css">
<style>
  /* Chat de prueba de Pensa: se ve como la conversación de WhatsApp del manual (barra negra, avatar bordó, globos sobrios). */
  :root { --globo-mio: #DCE7E2; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) { --globo-mio: #1F3A33; } }
  :root[data-tema="oscuro"] { --globo-mio: #1F3A33; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; font-size: 15px; }
  .cabecera { background: #131112; color: #F2F1EE; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: center; gap: 12px; }
  .cabecera img { width: 40px; height: 40px; flex: none; }
  .cabecera div { min-width: 0; }
  .cabecera b { display: block; font: 600 16px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cabecera small { display: block; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #8E8884; }
  .cabecera button { margin-left: auto; color: #F2F1EE; border-color: #2F2B2C; flex: none; }
  .cabecera button:hover { border-color: #F2F1EE; }
  #charla { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
  .cliente { align-self: flex-end; background: var(--globo-mio); border-top-right-radius: 2px; }
  .agente { align-self: flex-start; background: var(--hoja); border: 1px solid var(--linea); border-top-left-radius: 2px; }
  .aviso { align-self: center; font-size: 13px; color: var(--gris); text-align: center; max-width: 90%; }
  .msg a { color: inherit; }
  form { display: flex; gap: 8px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--hoja); border-top: 1px solid var(--linea); }
  form input { flex: 1; min-width: 0; }
  form button { flex: none; display: inline-flex; align-items: center; gap: 8px; }
  form button svg { width: 20px; height: 20px; }
  form button.icono { padding: 8px 10px; }
  form button.grabando { background: var(--bordo); border-color: var(--bordo); color: var(--texto-sobre-bordo); font-family: var(--mono); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="cabecera">
  <img src="/marca/avatar.svg" alt="Pensa">
  <div><b id="titulo">Chat de prueba</b><small id="estado">chat de prueba</small></div>
  <button id="nueva" type="button" title="Empezar una charla nueva, sin memoria">Nueva charla</button>
</header>
<main id="charla" aria-live="polite"></main>
<form id="form">
  <button class="icono" id="ubic" type="button" title="Mandar mi ubicación" aria-label="Mandar mi ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M12 21 C7 15 5 12 5 9 A7 7 0 0 1 19 9 C19 12 17 15 12 21 Z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
  <button class="icono" id="mic" type="button" title="Grabar una nota de voz (tocá de nuevo para mandarla)" aria-label="Grabar una nota de voz"></button>
  <input id="texto" autocomplete="off" placeholder="Escribí un mensaje" aria-label="Mensaje">
  <button class="primario" id="enviar" type="submit">Enviar</button>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 A7 7 0 0 0 19 11"/><path d="M12 18 V21"/></svg>';
  $("mic").innerHTML = MIC;
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const nuevaSesion = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36);

  const params = new URLSearchParams(location.search);
  const ficha = (params.get("ficha") || "").replace(/[^a-z0-9-]/g, "");
  const borrador = params.get("borrador") === "1";
  const claveSesion = "chat-sesion-" + (ficha || "def") + (borrador ? "-b" : "");
  let clave = leer("chat-clave") || "";
  let sesion = leer(claveSesion) || nuevaSesion();
  guardar(claveSesion, sesion);
  const estadoBase = borrador ? "probando el BORRADOR (sin publicar)" : "chat de prueba";
  $("estado").textContent = estadoBase;

  function burbuja(texto, clase) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    // Links clickeables y *negrita* como en WhatsApp, sin interpretar HTML.
    const seguro = texto.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    d.innerHTML = seguro
      .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
    $("charla").append(d);
    $("charla").scrollTop = $("charla").scrollHeight;
    return d;
  }
  function aviso(texto) {
    const d = document.createElement("div");
    d.className = "aviso"; d.textContent = texto;
    $("charla").append(d);
  }

  async function mandar(texto, audio) {
    if (!clave && !borrador) {
      clave = prompt("Clave del chat de prueba (CHAT_CLAVE en Vercel). Si entraste al panel, dejalo vacío:") || "";
      guardar("chat-clave", clave);
    }
    if (!audio) burbuja(texto.startsWith("[Ubicación") ? "Ubicación compartida" : texto, "cliente");
    const deAudio = audio ? burbuja(`Nota de voz (${audio.duracion}) · transcribiendo…`, "cliente") : null;
    $("enviar").disabled = true; $("estado").textContent = audio ? "escuchando el audio…" : "escribiendo…";
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ clave, sesion, texto, ficha, borrador, audio: audio?.datos, audio_tipo: audio?.tipo }) });
      const j = await r.json().catch(() => ({}));
      if (deAudio) deAudio.textContent = j.transcripcion ? `Nota de voz: ${j.transcripcion}` : `Nota de voz (${audio.duracion})`;
      if (j.ficha) {
        $("titulo").textContent = (j.ficha.agente ? j.ficha.agente + " · " : "") + j.ficha.nombre;
        document.title = $("titulo").textContent;
      }
      if (r.status === 403) { clave = ""; guardar("chat-clave", ""); aviso(j.error || "Clave incorrecta. Probá de nuevo."); }
      else if (!r.ok) aviso("Error: " + (j.error || r.status));
      else if (!j.respuestas.length) aviso("(El agente no responde: la charla está derivada a una persona o el agente está pausado. Escribí /reiniciar o tocá «Nueva charla».)");
      else j.respuestas.forEach((t) => burbuja(t, "agente"));
    } catch (e) { aviso("No se pudo conectar: " + e.message); }
    $("enviar").disabled = false; $("estado").textContent = estadoBase; $("texto").focus();
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("texto").value.trim();
    if (!t) return;
    $("texto").value = "";
    mandar(t);
  });
  $("ubic").addEventListener("click", () => {
    if (!navigator.geolocation) return aviso("Este navegador no comparte ubicación.");
    navigator.geolocation.getCurrentPosition(
      (p) => mandar(`[Ubicación compartida: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}]`),
      () => {
        const t = prompt("No pude leer tu ubicación. Escribí latitud y longitud (ej: -27.37, -55.90):");
        const m = t && t.match(/(-?\d+(?:\.\d+)?)[\s,]+(-?\d+(?:\.\d+)?)/);
        if (m) mandar(`[Ubicación compartida: ${m[1]}, ${m[2]}]`);
      },
      { enableHighAccuracy: true, timeout: 10000 },
    );
  });
  // Nota de voz: tocar el micrófono empieza a grabar, tocar de nuevo la manda. Como en WhatsApp, el agente recibe la transcripción.
  let grabadora = null, partes = [], inicio = 0, reloj = null;
  const MAX_SEG = 180;
  const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  async function empezarGrabacion() {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return aviso("Este navegador no graba audio.");
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return aviso("No hay permiso para usar el micrófono."); }
    const tipo = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    grabadora = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
    partes = [];
    grabadora.ondataavailable = (e) => e.data.size && partes.push(e.data);
    grabadora.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(reloj);
      $("mic").classList.remove("grabando"); $("mic").innerHTML = MIC;
      const duracion = mmss((Date.now() - inicio) / 1000);
      const blob = new Blob(partes, { type: grabadora.mimeType || tipo || "audio/webm" });
      grabadora = null;
      if (blob.size < 2000) return aviso("El audio quedó vacío. Grabá un poco más antes de mandarlo.");
      const lector = new FileReader();
      lector.onload = () => mandar("", { datos: String(lector.result).split(",")[1], tipo: blob.type, duracion });
      lector.readAsDataURL(blob);
    };
    grabadora.start();
    inicio = Date.now();
    $("mic").classList.add("grabando");
    $("mic").textContent = "Mandar audio 0:00";
    reloj = setInterval(() => {
      const s = (Date.now() - inicio) / 1000;
      $("mic").textContent = "Mandar audio " + mmss(s);
      if (s >= MAX_SEG) grabadora?.stop();
    }, 250);
  }
  $("mic").addEventListener("click", () => (grabadora ? grabadora.stop() : empezarGrabacion()));

  $("nueva").addEventListener("click", () => {
    sesion = nuevaSesion(); guardar(claveSesion, sesion);
    $("charla").innerHTML = ""; aviso("Charla nueva. El agente no recuerda lo anterior.");
  });
  aviso(borrador ? "Probando los cambios sin publicar. Los clientes reales siguen con la versión publicada." : "Chat de prueba. Si el agente toma pedidos, revisá en su ficha si están simulados.");
  $("texto").focus();
</script>
</body>
</html>
