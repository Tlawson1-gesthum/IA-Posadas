<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tablero de obra · Pensa</title>
<link rel="icon" href="/marca/avatar.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pensa.css">
<style>
  /* Tablero del dueño: resumen arriba (plata en juego y alertas), detalle abajo (partidas, gasoil, avance, partes). */
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
  @media (max-width: 640px) { main { padding: 24px 16px 48px; } }
  .obra h1 { font: 600 32px/1.1 var(--sans); letter-spacing: -.01em; margin-top: 8px; }
  .obra p { margin: 8px 0 0; color: var(--gris); font-size: 14px; }
  @media (max-width: 640px) { .obra h1 { font-size: 26px; } }

  .resumen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 32px; }
  @media (max-width: 900px) { .resumen { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .resumen .tarjeta { display: grid; gap: 8px; align-content: start; }
  .resumen .cifra.baja { color: var(--bordo-texto); }
  .resumen small { font-size: 13px; color: var(--gris); }
  @media (max-width: 640px) { .resumen { gap: 8px; } .resumen .tarjeta { padding: 12px; } .resumen .cifra { font-size: 18px; } }

  .alertas { display: grid; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); }
  .alerta { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px; border-top: 1px solid var(--linea); border-left: 2px solid transparent; align-items: start; }
  .alerta:first-child { border-top: 0; }
  .alerta.urgente { border-left-color: var(--bordo); }
  .alerta svg { width: 24px; height: 24px; color: var(--bordo-texto); }
  .alerta .que { display: grid; gap: 4px; }
  .alerta .cuando { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .alerta .monto { font: 500 15px/1.4 var(--mono); color: var(--bordo-texto); white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .alerta { grid-template-columns: minmax(0, 1fr) auto; } .alerta svg { display: none; } }
  .sin-alertas { display: flex; gap: 12px; align-items: center; color: var(--verde); }

  .partidas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .partida { display: grid; gap: 4px; align-content: start; }
  .partida header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .partida h3 { font: 600 18px/1.2 var(--sans); }
  .fila { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; padding: 4px 0; border-top: 1px solid var(--linea); }
  .leyenda + .fila { border-top: 0; }
  .fila span { color: var(--gris); }
  .fila b { font: 400 14px/1.4 var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fila.mal b { color: var(--bordo-texto); font-weight: 500; }
  .fila.bien b { color: var(--verde); }
  .lineas { display: grid; gap: 4px; margin: 0 0 8px; }
  .lineas div { height: 2px; background: var(--linea); }
  .lineas i { display: block; height: 100%; }
  .lineas .real i { background: var(--tinta); } .lineas .esperado i { background: var(--bordo-texto); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; }
  .leyenda span::before { content: ""; display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 8px; background: var(--tinta); }
  .leyenda span.esperado::before { background: var(--bordo-texto); }
  td.baja { color: var(--bordo-texto); font-weight: 500; }

  .progreso { display: inline-block; width: 120px; height: 2px; background: var(--linea); vertical-align: middle; margin-right: 12px; }
  .progreso i { display: block; height: 100%; background: var(--bordo-texto); }

  .partes { border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); }
  details.parte { border-top: 1px solid var(--linea); }
  details.parte:first-child { border-top: 0; }
  details.parte summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px; list-style: none; }
  details.parte summary::-webkit-details-marker { display: none; }
  details.parte summary::after { content: "Ver informe"; margin-left: auto; font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--bordo-texto); }
  details.parte[open] summary::after { content: "Cerrar"; }
  details.parte .fecha { font: 500 15px/1.2 var(--mono); }
  .informe { white-space: pre-wrap; font-size: 14px; line-height: 1.55; margin: 0 16px 16px; padding: 16px; background: var(--papel); border-left: 2px solid var(--bordo-texto); overflow-x: auto; }

  .pie { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--linea); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; color: var(--gris); font-size: 13px; }
</style>
</head>
<body>
<header class="pensa-barra">
  <div class="interior">
    <a class="pensa-marca" href="#" aria-label="Pensa · Tablero de obra">
      <img class="logo-ancho solo-claro" src="/marca/logo-bordo-grueso.svg" alt="Pensa">
      <img class="logo-ancho solo-oscuro" src="/marca/logo-blanco-grueso.svg" alt="Pensa">
      <img class="logo-angosto solo-claro" src="/marca/isotipo-bordo-grueso.svg" alt="Pensa">
      <img class="logo-angosto solo-oscuro" src="/marca/isotipo-blanco-grueso.svg" alt="Pensa">
      <span class="separador"></span>
      <span class="pantalla"><b>Tablero de obra</b><small id="empresa">Cargando</small></span>
    </a>
    <div class="controles">
      <select id="obra" aria-label="Obra" hidden></select>
      <div class="segmentos" role="group" aria-label="Período">
        <button type="button" data-p="hoy">Hoy</button><button type="button" data-p="semana" class="on">7 días</button><button type="button" data-p="mes">Mes</button>
      </div>
    </div>
  </div>
</header>
<main id="contenido"></main>
<div class="aviso-flotante" id="aviso" hidden></div>
<script>
  const $ = (id) => document.getElementById(id);
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NUM = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 1 });
  const num = (n) => NUM.format(n);
  const u = (x) => x === "m2" ? "m²" : x === "m3" ? "m³" : x;
  const fecha = (f) => `${f.slice(8, 10)}/${f.slice(5, 7)}`;
  const negrita = (t) => esc(t).replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  const ALERTA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M12 3 L22 20 H2 Z"/><path d="M12 10 V14"/><path d="M12 17 V17.5"/></svg>';

  // Claro en la computadora, oscuro en el celular del dueño (manual de marca, aplicaciones).
  if (innerWidth <= 640) document.documentElement.dataset.tema = "oscuro";

  const params = new URLSearchParams(location.search);
  const ficha = (params.get("ficha") || "").replace(/[^a-z0-9-]/g, "");
  let clave = leer("chat-clave") || "";
  let periodo = "semana", obraId = "", moneda = "$";
  const plata = (n) => `${moneda} ${Math.round(n).toLocaleString("es-AR")}`;

  function aviso(t) { const a = $("aviso"); a.textContent = t; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => (a.hidden = true), 3500); }
  function rango() {
    const hoy = new Date(Date.now() - 3 * 3600_000).toISOString().slice(0, 10);
    if (periodo === "hoy") return { desde: hoy, hasta: hoy };
    if (periodo === "mes") return { desde: hoy.slice(0, 8) + "01", hasta: hoy };
    return { desde: new Date(Date.parse(hoy + "T12:00:00Z") - 6 * 86400_000).toISOString().slice(0, 10), hasta: hoy };
  }

  async function pedir(metodo, cuerpo) {
    const r = rango();
    const url = metodo === "GET" ? `/api/obra?ficha=${encodeURIComponent(ficha)}&obra=${encodeURIComponent(obraId)}&desde=${r.desde}&hasta=${r.hasta}` : "/api/obra";
    const res = await fetch(url, { method: metodo, headers: { "x-clave": clave, "content-type": "application/json" }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    if (res.status === 403) {
      clave = prompt("Clave del tablero (la misma del chat de prueba). Si entraste a la central, dejala vacía:") || "";
      guardar("chat-clave", clave);
      if (clave) return pedir(metodo, cuerpo);
    }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `El servidor respondió ${res.status}`);
    return j;
  }

  function partida(p) {
    const real = p.es_combustible ? p.informado : p.recibido;
    const tope = Math.max(real, p.esperado, 1e-9);
    const etiquetaReal = p.es_combustible ? "Cargado a equipos" : "Entró a obra";
    const etiquetaEsp = p.es_combustible ? "Esperado por horas" : "Esperado por avance";
    const m = p.stock_medido;
    const falta = m ? m.teorico - m.cantidad : 0;
    return `<article class="tarjeta partida">
      <header><h3>${esc(p.nombre)}</h3><span class="etiqueta unidad">${u(p.unidad)}</span></header>
      <div class="lineas" aria-hidden="true"><div class="real"><i style="width:${(real / tope) * 100}%"></i></div><div class="esperado"><i style="width:${(p.esperado / tope) * 100}%"></i></div></div>
      <div class="leyenda etiqueta"><span>${etiquetaReal}</span><span class="esperado">${etiquetaEsp}</span></div>
      <div class="fila"><span>Remitos</span><b>${num(p.remitos)} ${u(p.unidad)}</b></div>
      ${p.recibido !== p.remitos ? `<div class="fila mal"><span>Llegó de verdad</span><b>${num(p.recibido)} ${u(p.unidad)}</b></div>` : ""}
      <div class="fila"><span>${etiquetaEsp}</span><b>${num(p.esperado)} ${u(p.unidad)}</b></div>
      ${p.es_combustible || p.informado ? `<div class="fila"><span>${p.es_combustible ? "Cargado a equipos" : "Informado por obra"}</span><b>${num(p.informado)} ${u(p.unidad)}</b></div>` : ""}
      <div class="fila"><span>Debería haber hoy</span><b>${num(p.stock_teorico)} ${u(p.unidad)}</b></div>
      ${m ? `<div class="fila ${falta > Math.abs(m.teorico) * 0.05 ? "mal" : "bien"}"><span>Contado el ${fecha(m.fecha)} (debía haber ${num(m.teorico)})</span><b>${num(m.cantidad)} ${u(p.unidad)}</b></div>` : ""}
      <div class="fila"><span>Compras del período</span><b>${plata(p.compra)}</b></div>
    </article>`;
  }

  function dibujar(d) {
    const r = d.resumen;
    moneda = r.moneda;
    $("empresa").textContent = d.ficha.nombre;
    document.title = `${r.obra.nombre} · Pensa`;
    if (d.obras.length > 1) {
      $("obra").hidden = false;
      $("obra").innerHTML = d.obras.map((o) => `<option value="${esc(o.id)}" ${o.id === r.obra.id ? "selected" : ""}>${esc(o.nombre)}</option>`).join("");
    }
    const urgentes = r.alertas.filter((a) => a.nivel === "roja").length;
    const compras = r.partidas.reduce((s, p) => s + p.compra, 0) + r.transporte.costo;
    const periodoTxt = r.desde === r.hasta ? `hoy, ${fecha(r.hasta)}` : `del ${fecha(r.desde)} al ${fecha(r.hasta)}`;
    const h = [];
    h.push(`<section class="obra"><span class="etiqueta marca">Obra · ${esc(r.obra.comitente)}</span><h1>${esc(r.obra.nombre)}</h1>
      <p>${r.partes.length} parte${r.partes.length === 1 ? "" : "s"} ${periodoTxt}. Los montos usan los precios de referencia cargados para esta obra.</p></section>`);
    h.push(`<section class="resumen" aria-label="Resumen del período">
      <div class="tarjeta"><span class="etiqueta">Plata en juego</span><span class="cifra ${r.en_juego > 0 ? "baja" : ""}">${plata(r.en_juego)}</span><small>Suma de las diferencias a revisar</small></div>
      <div class="tarjeta"><span class="etiqueta">Alertas</span><span class="cifra">${urgentes} · ${r.alertas.length - urgentes}</span><small>${urgentes} urgente${urgentes === 1 ? "" : "s"}, ${r.alertas.length - urgentes} a revisar</small></div>
      <div class="tarjeta"><span class="etiqueta">Compras y fletes</span><span class="cifra">${plata(compras)}</span><small>Según remitos del período</small></div>
      <div class="tarjeta"><span class="etiqueta">Certificable</span><span class="cifra">${plata(r.certificable)}</span><small>Avance del período por precio unitario</small></div>
    </section>`);

    h.push(`<div class="seccion"><h2>Qué revisar</h2><span>Ordenado por urgencia y por plata en juego</span></div>`);
    h.push(r.alertas.length
      ? `<div class="alertas">${r.alertas.map((a) => `<div class="alerta ${a.nivel === "roja" ? "urgente" : ""}">${ALERTA}
          <div class="que"><div class="cuando"><span class="estado ${a.nivel === "roja" ? "urgente" : "revisar"}">${a.nivel === "roja" ? "Urgente" : "Revisar"}</span><span class="etiqueta">${fecha(a.fecha)}</span></div><span>${esc(a.detalle)}</span></div>
          <span class="monto">${a.monto > 0 ? plata(a.monto) : ""}</span></div>`).join("")}</div>`
      : `<div class="tarjeta sin-alertas"><span class="estado ok">Sin diferencias</span><span>Los remitos, el gasoil y el stock cierran con el presupuesto en este período.</span></div>`);

    h.push(`<div class="seccion"><h2>Partidas</h2><span>Lo que entró contra lo que el avance dice que se usó</span></div><div class="partidas">${r.partidas.map(partida).join("")}
      <article class="tarjeta partida"><header><h3>Fletes</h3><span class="etiqueta unidad">viajes</span></header>
        <div class="fila" style="border-top:0"><span>Viajes con camión identificado</span><b>${r.transporte.viajes}</b></div>
        <div class="fila ${r.transporte.con_problemas ? "mal" : "bien"}"><span>Con problemas</span><b>${r.transporte.con_problemas}</b></div>
        <div class="fila"><span>Costo del período</span><b>${plata(r.transporte.costo)}</b></div>
        ${r.transporte.por_transportista.map((t) => `<div class="fila"><span>${esc(t.nombre)}</span><b>${t.viajes} · ${plata(t.costo)}</b></div>`).join("")}
      </article></div>`);

    if (r.combustible.length) h.push(`<div class="seccion"><h2>Gasoil por equipo</h2><span>Cargado contra horas por consumo de cada equipo</span></div>
      <div class="tarjeta tabla-caja" style="padding:0"><table class="pensa">
      <thead><tr><th>Equipo</th><th class="n">Horas</th><th class="n">Cargado</th><th class="n">Esperado</th><th class="n">Diferencia</th></tr></thead><tbody>
      ${r.combustible.map((e) => { const dif = e.esperado ? e.litros / e.esperado - 1 : 0;
        return `<tr><td>${esc(e.nombre)}</td><td class="n">${num(e.horas)} h</td><td class="n">${num(e.litros)} l</td><td class="n">${num(e.esperado)} l</td>
          <td class="n ${dif > 0.1 ? "baja" : ""}">${dif >= 0 ? "+" : "−"}${Math.abs(Math.round(dif * 100))}%</td></tr>`; }).join("")}</tbody></table></div>`);

    h.push(`<div class="seccion"><h2>Avance y certificación</h2><span>${plata(r.certificable)} certificables en el período</span></div>
      <div class="tarjeta tabla-caja" style="padding:0"><table class="pensa">
      <thead><tr><th>Tarea</th><th class="n">Período</th><th>Acumulado del contrato</th><th class="n">A certificar</th></tr></thead><tbody>
      ${r.avance.map((a) => { const p = a.contrato ? Math.min(1, a.acumulado / a.contrato) : 0;
        return `<tr><td>${esc(a.nombre)}</td><td class="n">${num(a.periodo)} ${u(a.unidad)}</td>
          <td><span class="progreso"><i style="width:${p * 100}%"></i></span><span class="dato">${Math.round(p * 100)}%</span> <span style="color:var(--gris)">· ${num(a.acumulado)} de ${num(a.contrato)} ${u(a.unidad)}</span></td>
          <td class="n">${plata(a.periodo * a.precio_unitario)}</td></tr>`; }).join("")}</tbody></table></div>`);

    h.push(`<div class="seccion"><h2>Partes del período</h2><span>Como los recibió el capataz por WhatsApp</span></div><div class="partes">${r.partes.length
      ? r.partes.map((p) => `<details class="parte" data-id="${esc(p.id)}"><summary><span class="fecha">${fecha(p.fecha)}</span><span>${esc(p.responsable || "Sin nombre")}</span>
          ${p.estado === "pendiente" ? '<span class="estado neutro">Sin confirmar</span>' : ""}
          ${p.rojas ? `<span class="estado urgente">${p.rojas} urgente${p.rojas > 1 ? "s" : ""}</span>` : ""}
          ${p.amarillas ? `<span class="estado revisar">${p.amarillas} a revisar</span>` : ""}
          ${!p.rojas && !p.amarillas ? '<span class="estado ok">Sin diferencias</span>' : ""}
          ${p.pedidos.length ? `<span class="estado neutro">${p.pedidos.length} pedido${p.pedidos.length > 1 ? "s" : ""}</span>` : ""}
        </summary><div class="informe">${negrita(d.informes[p.id] || "")}</div></details>`).join("")
      : '<p style="margin:0;padding:16px;color:var(--gris)">Todavía no hay partes en este período.</p>'}</div>`);

    h.push(`<footer class="pie"><span class="etiqueta">Sistemas que entienden de negocio.</span><span>Se actualiza solo cada 30 segundos.</span>
      ${d.semilla ? '<button type="button" id="semilla">Cargar semana de ejemplo</button>' : ""}</footer>`);
    $("contenido").innerHTML = h.join("");
    $("semilla")?.addEventListener("click", async () => {
      if (!confirm("Esto borra los partes de esta ficha y carga una semana de ejemplo. ¿Seguir?")) return;
      try { const j = await pedir("POST", { accion: "semilla", ficha }); aviso(`Semana de ejemplo cargada: ${j.partes} partes.`); cargar(); }
      catch (e) { aviso(e.message); }
    });
  }

  async function cargar() {
    // Mantiene abiertos los informes que la persona estaba leyendo.
    const abiertos = new Set([...document.querySelectorAll("details.parte[open]")].map((x) => x.dataset.id));
    try {
      const d = await pedir("GET");
      obraId = d.resumen.obra.id;
      dibujar(d);
      document.querySelectorAll("details.parte").forEach((x) => { if (abiertos.has(x.dataset.id)) x.open = true; });
    } catch (e) {
      $("contenido").innerHTML = `<div class="tarjeta">${esc(e.message)}</div>`;
    }
  }

  document.querySelectorAll(".segmentos button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".segmentos button").forEach((x) => x.classList.toggle("on", x === b));
    periodo = b.dataset.p; cargar();
  }));
  $("obra").addEventListener("change", (e) => { obraId = e.target.value; cargar(); });
  setInterval(() => { if (!document.hidden) cargar(); }, 30_000);
  cargar();
</script>
</body>
</html>
