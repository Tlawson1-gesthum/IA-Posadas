<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Central de agentes · Pensa</title>
<link rel="icon" href="/marca/avatar.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pensa.css">
<style>
  /* Colores, letras y botones salen de /pensa.css (manual de marca de Pensa). Estos nombres son los que ya usaba la central. */
  :root {
    --fondo: var(--papel); --tarjeta: var(--hoja); --texto: var(--tinta); --suave: var(--gris); --borde: var(--linea);
    --acento: var(--bordo-texto); --acento-txt: var(--texto-sobre-bordo); --primario: var(--bordo);
    --rojo: var(--bordo-texto); --amarillo: var(--bordo-texto);
    --cliente: var(--papel); --agente: var(--verde-fondo); --humano: var(--bordo-fondo);
    --titulos: var(--sans); --numeros: var(--mono);
  }
  body { min-height: 100vh; font-size: 15px; }
  .marca { cursor: pointer; }
  .temas button { padding: 6px 12px; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h2 { font: 600 22px/1.2 var(--sans); margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--linea); position: relative; }
  h2::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 48px; height: 2px; background: var(--bordo-texto); }
  .fila > h2 { flex: 1; }
  h3 { font: 600 16px var(--sans); margin: 16px 0 8px; }
  .kpi b { display: block; font: 500 26px/1.15 var(--mono); letter-spacing: -.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi.alerta-on { border-color: var(--bordo-texto); }

  /* ---------- Tablero: motor central alimentando a los agentes ---------- */
  .tablero-top { display: grid; grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr); gap: 14px; }
  @media (max-width: 860px) { .tablero-top { grid-template-columns: 1fr; } }
  .lateral { display: grid; gap: 12px; align-content: start; }
  .motor-tarjeta { padding: 16px 16px 8px; overflow: hidden; position: relative; }
  .motor-tarjeta .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .motor { width: 100%; height: auto; display: block; }
  .motor text { font-family: var(--sans); fill: var(--tinta); }
  .motor .sub { font: 500 10px var(--mono); fill: var(--gris); letter-spacing: .08em; }
  .motor .cable { fill: none; stroke: var(--linea); stroke-width: 1.5; }
  .motor .cable.activo { stroke: var(--tinta); stroke-width: 1.5; }
  .motor .cable.vivo { stroke: var(--bordo-texto); stroke-width: 2.5; }
  .motor .nucleo { fill: #6B1A26; }
  .motor .nodo { cursor: pointer; }
  .motor .nodo circle.fondo { fill: var(--hoja); stroke: var(--tinta); stroke-width: 1.5; }
  .motor .nodo:hover circle.fondo, .motor .nodo:focus-visible circle.fondo { stroke-width: 2.5; }
  .motor .nodo:focus { outline: none; }
  .motor .nodo.verde circle.fondo { stroke: var(--verde); }
  .motor .nodo.amarillo circle.fondo { stroke: var(--bordo-texto); stroke-dasharray: 4 3; }
  .motor .nodo.rojo circle.fondo { stroke: var(--bordo); fill: var(--bordo-fondo); stroke-width: 2.5; }
  .motor .nodo.gris circle.fondo { stroke: var(--linea); }
  .motor .nodo.gris text { fill: var(--gris); }
  .leyenda-motor { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--suave); padding: 0 4px 6px; }
  .leyenda-motor span { display: inline-flex; align-items: center; gap: 6px; }
  .kpi small { display: block; font-size: 12px; color: var(--suave); margin-top: 2px; }
  .kpi .aviso-bajo { color: var(--amarillo); font-weight: 600; }
  .grilla.kpis { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); margin-top: 14px; }
  .grafico { position: relative; }
  .grafico svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grafico .barra-dato { fill: var(--acento); }
  .grafico .golpe { fill: transparent; cursor: default; }
  .grafico .golpe:hover + .barra-dato, .grafico g:hover .barra-dato { opacity: .75; }
  .grafico .eje { stroke: var(--borde); stroke-width: 1; }
  .grafico text { font: 500 10px var(--numeros); fill: var(--suave); }
  .tooltip { position: absolute; pointer-events: none; background: var(--tarjeta); border: 1px solid var(--tinta); border-radius: var(--radio); padding: 8px 12px;
    font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%); display: none; z-index: 3; }
  .tooltip b { font-family: var(--numeros); }

  textarea { min-height: 90px; resize: vertical; }
  label { display: block; font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gris); margin: 16px 0 8px; }
  .suave { color: var(--suave); } .chico { font-size: 13px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 14px; }

  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  /* Semáforo: verde = funciona; aro bordó = espera a una persona; bordó lleno = error o tope; gris = pausado. */
  .punto.verde { background: var(--verde); } .punto.amarillo { background: transparent; border: 2px solid var(--bordo-texto); }
  .punto.rojo { background: var(--bordo); } .punto.gris { background: var(--linea); }

  .tabla { width: 100%; border-collapse: collapse; }
  .tabla th, .tabla td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  .tabla th { font: 500 12px var(--mono); color: var(--gris); text-transform: uppercase; letter-spacing: .08em; border-bottom-color: var(--tinta); }
  .tabla tr:last-child td { border-bottom: 0; }
  .tabla tr.click { cursor: pointer; transition: background .12s; } .tabla tr.click:hover { background: color-mix(in srgb, var(--acento) 7%, transparent); }
  .num { text-align: right; font-family: var(--numeros); font-size: 14px; font-variant-numeric: tabular-nums; }
  .neg { color: var(--bordo-texto); font-weight: 500; }
  .barrita { height: 2px; background: var(--linea); margin-top: 8px; overflow: hidden; }
  .barrita i { display: block; height: 100%; background: var(--tinta); }
  .barrita i.lleno { background: var(--bordo-texto); }

  .alerta { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; background: var(--hoja); border: 1px solid var(--linea);
    border-left: 2px solid var(--linea); border-radius: var(--radio); margin-bottom: 8px; cursor: pointer; }
  .alerta:hover { border-color: var(--tinta); }
  .alerta.error, .alerta.tope_mes { border-left-color: var(--bordo); }
  .pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin: 12px 0 16px; overflow-x: auto; }
  .pestanas button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--suave); }
  .pestanas button.on { border-bottom-color: var(--acento); color: var(--texto); font-weight: 600; }
  .charla { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 14px; }
  .lista-charlas { max-height: 70vh; overflow-y: auto; }
  .item-charla { padding: 11px 12px; border-bottom: 1px solid var(--borde); cursor: pointer; transition: background .12s; }
  .item-charla:hover, .item-charla.sel { background: color-mix(in srgb, var(--acento) 8%, transparent); }
  .mensajes { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid transparent; }
  .msg.cliente { align-self: flex-start; background: var(--cliente); border-bottom-left-radius: 4px; }
  .msg.agente { align-self: flex-end; background: var(--agente); border-bottom-right-radius: 4px; }
  .msg.humano { align-self: flex-end; background: var(--humano); border-bottom-right-radius: 4px; }
  .msg.cliente { border-color: var(--linea); }
  .msg small { display: block; font: 500 11px var(--numeros); color: var(--suave); margin-top: 4px; }
  .aviso { padding: 12px 16px; border-radius: var(--radio); background: var(--bordo-fondo); border-left: 2px solid var(--bordo-texto); margin: 8px 0; }
  .problemas { color: var(--rojo); margin: 6px 0; padding-left: 18px; }
  .centro { min-height: 78vh; display: grid; place-items: center; }
  .oculto { display: none !important; }
  #toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--tinta); color: var(--papel);
    padding: 12px 16px; border-radius: var(--radio); z-index: 20; max-width: 90vw; }
  @media (max-width: 760px) {
    .charla { grid-template-columns: 1fr; }
    .tabla .opcional { display: none; }
    #cuenta-alertas { display: none; }
    .temas button { padding: 4px 8px; font-size: 12px; }
    .tabla td, .tabla th { padding: 10px 6px; }
    main { padding: 16px; }
  }
  @media (max-width: 440px) { .pensa-marca .pantalla small { display: none; } }
</style>
</head>
<body>
<header class="pensa-barra">
  <div class="interior">
    <span class="pensa-marca marca" onclick="ir('')">
      <img class="logo-ancho solo-claro" src="/marca/logo-bordo-grueso.svg" alt="Pensa">
      <img class="logo-ancho solo-oscuro" src="/marca/logo-blanco-grueso.svg" alt="Pensa">
      <img class="logo-angosto solo-claro" src="/marca/isotipo-bordo-grueso.svg" alt="Pensa">
      <img class="logo-angosto solo-oscuro" src="/marca/isotipo-blanco-grueso.svg" alt="Pensa">
      <span class="separador"></span>
      <span class="pantalla"><b>Central de agentes</b><small>Equipo Pensa</small></span>
    </span>
    <div class="controles">
      <span id="cuenta-alertas" class="chico"></span>
      <div class="temas segmentos" role="group" aria-label="Tema">
        <button data-tema="claro" onclick="ponerTema('claro')">Claro</button>
        <button data-tema="oscuro" onclick="ponerTema('oscuro')">Oscuro</button>
      </div>
      <button class="oculto" id="b-salir" onclick="salir()">Salir</button>
    </div>
  </div>
</header>
<main id="vista"></main>
<div id="toast" class="oculto"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (n) => "US$ " + Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fecha = (iso) => iso ? new Date(iso).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "sin fecha";
const hace = (min) => min == null ? "" : min < 1 ? "recién" : min < 60 ? `hace ${min} min` : min < 1440 ? `hace ${Math.round(min / 60)} h` : `hace ${Math.round(min / 1440)} d`;
const nombreCharla = (t) => t.startsWith("web-publico-") ? "Burbuja en la web (cliente)" : t.startsWith("web-borrador-") ? "Prueba de borrador" : t.startsWith("web-") ? "Chat web de prueba" : "+" + t;
const SEMAFORO = { verde: "Funcionando", amarillo: "Con charlas derivadas", rojo: "Con errores o sin saldo", gris: "Pausado" };

// Claro u oscuro: si no se eligió, sigue al sistema (claro en la computadora, oscuro en el celular del dueño).
function ponerTema(t, guardarlo = true) {
  if (t) document.documentElement.dataset.tema = t;
  if (t && guardarlo) try { localStorage.setItem("panel-tema", t); } catch {}
  const efectivo = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
  document.querySelectorAll(".temas button").forEach((b) => b.classList.toggle("on", b.dataset.tema === efectivo));
}
ponerTema((() => { try { const t = localStorage.getItem("panel-tema"); return t === "claro" || t === "oscuro" ? t : null; } catch { return null; } })(), false);

function aviso(texto) {
  const t = $("#toast"); t.textContent = texto; t.classList.remove("oculto");
  clearTimeout(aviso.t); aviso.t = setTimeout(() => t.classList.add("oculto"), 4000);
}

async function api(accion, datos = {}) {
  const r = await fetch("/api/panel", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ accion, ...datos }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && accion !== "entrar") { mostrarEntrar(); throw new Error(j.error || "Sesión vencida"); }
  if (!r.ok) throw new Error(j.error || "Algo salió mal");
  return j;
}

function ir(ruta) { location.hash = ruta ? "#" + ruta : ""; }
window.addEventListener("hashchange", enrutar);

async function enrutar() {
  const [vista, id, sub] = location.hash.slice(1).split("/");
  try {
    if (vista === "cliente" && id) await verCliente(decodeURIComponent(id), sub || "charlas");
    else if (vista === "nuevo") verNuevo();
    else await verTablero();
    $("#b-salir").classList.remove("oculto");
  } catch (e) { if (!String(e.message).includes("Sesión")) aviso(e.message); }
}

// ------------------------------------------------------------------ entrar
function mostrarEntrar() {
  $("#b-salir").classList.add("oculto"); $("#cuenta-alertas").innerHTML = "";
  $("#vista").innerHTML = `
    <div class="centro"><form class="tarjeta" id="f-entrar" style="width:min(380px,100%);padding:24px">
      <div style="display:grid;gap:16px;margin-bottom:8px"><img class="solo-claro" src="/marca/logo-bordo.svg" alt="Pensa" style="height:40px;width:auto">
        <img class="solo-oscuro" src="/marca/logo-blanco.svg" alt="Pensa" style="height:40px;width:auto">
        <div><b style="font:600 20px/1.2 var(--sans)">Central de agentes</b><div class="etiqueta" style="margin-top:4px">Acceso del equipo</div></div></div>
      <label for="clave">Clave del panel</label>
      <input id="clave" type="password" autocomplete="current-password" required autofocus>
      <p class="fila" style="margin-top:14px"><button class="primario" type="submit">Entrar</button></p>
    </form></div>`;
  $("#f-entrar").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("entrar", { clave: $("#clave").value }); enrutar(); } catch (err) { aviso(err.message); }
  };
}
async function salir() { await api("salir").catch(() => {}); mostrarEntrar(); }

// ------------------------------------------------------------------ tablero
// Saldo de Claude: Anthropic no lo da por API. Se carga el que muestra la consola y se le resta lo que gasta el motor.
function tarjetaCredito(c) {
  const bajo = c && c.saldo != null && c.saldo < 5;
  const cuerpo = !c ? `<b>Sin cargar</b><span class="suave chico">Cargá el saldo que ves en la consola de Claude.</span>`
    : c.saldo == null ? `<b>${usd(c.cargado)}</b><span class="suave chico">Para descontar el gasto falta correr supabase/006_saldo_claude.sql.</span>`
    : `<b>≈ ${usd(c.saldo)}</b><span class="suave chico">Cargaste ${usd(c.cargado)} ${hace(Math.round((Date.now() - Date.parse(c.fecha)) / 60000))} · el motor gastó ${usd(c.gastado)} desde entonces.${bajo ? ` <span class="aviso-bajo">Queda poco: recargá.</span>` : ""}</span>`;
  return `<div class="tarjeta kpi ${bajo ? "alerta-on" : ""}"><div class="etiqueta">Saldo de Claude (estimado)</div>${cuerpo}
    <div class="fila chico" style="margin-top:8px;gap:10px"><button type="button" onclick="cargarCredito()">Actualizar saldo</button>
    <a href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">Ver en la consola</a></div></div>`;
}
async function cargarCredito() {
  const v = prompt("¿Cuánto saldo muestra la consola de Claude ahora? (en dólares, ej. 23.50)");
  if (v == null || !v.trim()) return;
  try { await api("credito", { usd: v.trim() }); aviso("Saldo guardado"); verTablero(); } catch (e) { aviso(e.message); }
}

// Pensa en el centro y cada agente alrededor, unido por una línea.
// Borde del agente = semáforo. Línea bordó = recibió mensajes en los últimos 10 minutos. Pausado = línea punteada.
function dibujarMotor(clientes) {
  // En el celular el dibujo es más angosto (y alto) para que se lea.
  const angosto = innerWidth < 640, n = clientes.length;
  const W = angosto ? 440 : 760, H = n <= 2 ? (angosto ? 230 : 250) : angosto ? 420 : 370, cx = W / 2, cy = H / 2 - 4;
  const rx = angosto ? (n <= 2 ? 158 : 160) : n <= 2 ? 250 : 290, ry = n <= 2 ? 0 : angosto ? 150 : 118;
  const ahora = Date.now();
  const nodos = clientes.map((c, i) => {
    // Con 1 o 2 agentes van a los costados; con más, en óvalo empezando arriba a la izquierda.
    const ang = n === 1 ? 0 : n === 2 ? Math.PI * i : -Math.PI / 2 - Math.PI / n + (2 * Math.PI * i) / n;
    const x = cx + rx * Math.cos(ang), y = cy + (ry || 0) * Math.sin(ang);
    const vivo = c.estado === "activo" && c.ultimo_mensaje && ahora - Date.parse(c.ultimo_mensaje) < 10 * 60_000;
    return { c, x, y, vivo };
  });
  const cables = nodos.map(({ c, x, y, vivo }) => {
    const mx = (cx + x) / 2, my = (cy + y) / 2 - 28;
    const d = `M${cx.toFixed(1)},${cy.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`;
    if (c.estado !== "activo") return `<path class="cable" d="${d}" stroke-dasharray="3 5"/>`;
    return `<path class="cable ${vivo ? "vivo" : "activo"}" d="${d}"/>`;
  }).join("");
  const agentes = nodos.map(({ c, x, y, vivo }) => {
    const inicial = esc((c.nombre || "?").trim()[0] || "?").toUpperCase();
    const debajo = y > cy - 20;
    const ty = debajo ? y + 46 : y - 52;
    return `<g class="nodo ${c.semaforo} ${vivo ? "vivo" : ""}" data-id="${esc(c.id)}" tabindex="0" role="link" aria-label="${esc(c.nombre)} (${esc(c.rubro)}): ${SEMAFORO[c.semaforo]}">
      <title>${esc(c.nombre)} · ${esc(c.rubro)} · ${SEMAFORO[c.semaforo]} · ${c.mensajes_mes} mensajes este mes</title>
      <circle class="fondo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="26"/>
      <text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="18" font-weight="600">${inicial}</text>
      <text x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="14" font-weight="600">${esc(c.nombre)}</text>
      <text class="sub" x="${x.toFixed(1)}" y="${(ty + 15).toFixed(1)}" text-anchor="middle">${esc(c.rubro.toUpperCase())} · ${c.mensajes_mes} MSJ</text>
    </g>`;
  }).join("");
  return `<svg class="motor" id="motor-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pensa en el centro con ${n} agentes conectados">
    ${cables}
    <circle class="nucleo" cx="${cx}" cy="${cy}" r="40"/>
    <image href="/marca/isotipo-blanco-grueso.svg" x="${cx - 23}" y="${cy - 17.5}" width="46" height="35"/>
    ${agentes}
  </svg>`;
}
// Barras de mensajes de clientes por día. Un solo dato por barra: color único, sin leyenda; el detalle va en el tooltip.
function graficoActividad(datos, angosto = innerWidth < 640) {
  const dias = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - 3 * 3600_000 - i * 86400_000).toISOString().slice(0, 10);
    dias.push(datos.find((x) => x.dia === d) || { dia: d, mensajes: 0, charlas: 0, usd: 0 });
  }
  // En el celular se dibuja más angosto para que el texto no quede diminuto.
  const W = angosto ? 360 : 760, H = angosto ? 190 : 170, ab = 22, ar = 10, iz = 26, paso = (W - iz) / dias.length, ancho = Math.max(6, paso - (angosto ? 6 : 10));
  const max = Math.max(5, ...dias.map((d) => d.mensajes));
  const tope = Math.ceil(max / 5) * 5, alto = H - ab - ar;
  const y = (v) => ar + alto - (v / tope) * alto;
  const nombre = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("es-AR", { weekday: "short", day: "numeric", timeZone: "UTC" });
  const barras = dias.map((d, i) => {
    const x = iz + i * paso + (paso - ancho) / 2, h = Math.max(0, alto - (y(d.mensajes) - ar));
    const r = Math.min(4, h, ancho / 2);
    // Barra con las puntas de arriba redondeadas (4px) y apoyada en la base.
    const barra = h > 0 ? `<path class="barra-dato" d="M${x},${ar + alto} V${ar + alto - h + r} Q${x},${ar + alto - h} ${x + r},${ar + alto - h} H${x + ancho - r} Q${x + ancho},${ar + alto - h} ${x + ancho},${ar + alto - h + r} V${ar + alto} Z"/>` : "";
    const etiqueta = (angosto ? i % 4 === 1 : i % 2 === 1) ? `<text x="${x + ancho / 2}" y="${H - 6}" text-anchor="middle">${nombre(d.dia)}</text>` : "";
    return `<g data-tip="<b>${nombre(d.dia)}</b><br>${d.mensajes} mensajes de clientes<br>${d.charlas} charla${d.charlas === 1 ? "" : "s"} · ${usd(d.usd)}">
      <rect class="golpe" x="${iz + i * paso}" y="${ar}" width="${paso}" height="${alto}"/>${barra}${etiqueta}</g>`;
  }).join("");
  const guias = [0, tope / 2, tope].map((v) => `<line class="eje" x1="${iz}" x2="${W}" y1="${y(v)}" y2="${y(v)}" ${v ? 'stroke-dasharray="2 4"' : ""}/><text x="${iz - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  const total = dias.reduce((s, d) => s + d.mensajes, 0);
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mensajes de clientes por día: ${total} en 14 días">${guias}${barras}</svg><div class="tooltip" id="tip"></div></div>
    <details class="chico" style="margin-top:6px"><summary class="suave">Ver como tabla</summary>
      <table class="tabla"><thead><tr><th>Día</th><th class="num">Mensajes</th><th class="num">Charlas</th><th class="num">Costo IA</th></tr></thead>
      <tbody>${dias.slice().reverse().map((d) => `<tr><td>${nombre(d.dia)}</td><td class="num">${d.mensajes}</td><td class="num">${d.charlas}</td><td class="num">${usd(d.usd)}</td></tr>`).join("")}</tbody></table></details>`;
}

function activarTooltip() {
  const caja = document.querySelector(".grafico"), tip = $("#tip");
  if (!caja || !tip) return;
  caja.addEventListener("mousemove", (e) => {
    const g = e.target.closest("g[data-tip]");
    if (!g) { tip.style.display = "none"; return; }
    const r = caja.getBoundingClientRect(), b = g.querySelector(".golpe").getBoundingClientRect();
    tip.innerHTML = g.dataset.tip;
    tip.style.display = "block";
    tip.style.left = Math.min(r.width - 70, Math.max(70, b.left - r.left + b.width / 2)) + "px";
    tip.style.top = (e.clientY - r.top - 12) + "px";
  });
  caja.addEventListener("mouseleave", () => (tip.style.display = "none"));
}

      nombre: v("nombre").trim(), rubro: v("rubro").trim(), plantilla: v("plantilla"), modelo: v("modelo"), esfuerzo: v("esfuerzo"),
      tope_usd_mes: Number(v("tope_usd_mes")),
      limites: { mensajes_por_hora: Number(v("lim_mensajes_por_hora")), mensajes_por_dia: Number(v("lim_mensajes_por_dia")),
        usd_por_persona_dia: Number(v("lim_usd_por_persona_dia")), caracteres_por_mensaje: Number(v("lim_caracteres_por_mensaje")) },
      herramientas: [...form.querySelectorAll("input[name=herr]:checked")].map((x) => x.value),
      datos: Object.fromEntries(campos.map((k) => [k, form.elements["dato_" + k].value])),
    };
    if (v("int_base_url").trim()) nueva.integracion = { ...(c.integracion || {}), tipo: v("int_tipo").trim(), base_url: v("int_base_url").trim(), crear_pedidos: form.elements.int_crear.checked, clave_env: v("int_clave").trim() || undefined,
      pagos_agente: [...form.querySelectorAll("input[name=int_pago]:checked")].map((x) => x.value) };
    else delete nueva.integracion;
    if (v("conocimiento_url").trim()) nueva.conocimiento = { url: v("conocimiento_url").trim() };
    else delete nueva.conocimiento;
    nueva.chat_web = { activo: form.elements.cw_activo.checked, color: v("cw_color"), saludo: v("cw_saludo").trim(),
      mensajes_por_ip_hora: Number(v("cw_ip")) || 20, mensajes_por_dia: Number(v("cw_dia")) || 400 };
    try {
      const r = await api("guardar", { id, config: nueva, abono_usd_mes: Number(v("abono")), whatsapp_phone_number_id: v("wa") });
      aviso(r.problemas.length ? "Borrador guardado, pero hay cosas para corregir" : "Borrador guardado. Probalo y publicalo.");
      verFicha(id);
    } catch (err) { aviso(err.message); }
  };
  $("#b-publicar")?.addEventListener("click", async () => {
    const nota = prompt("¿Qué cambiaste? (queda en el historial)");
    if (!nota) return;
    try { const r = await api("publicar", { id, nota }); aviso(`Publicada la v${r.version}`); verCliente(id, "ficha"); } catch (e) { aviso(e.message); }
  });
  $("#b-descartar")?.addEventListener("click", async () => {
    if (!confirm("¿Descartar todos los cambios sin publicar?")) return;
    try { await api("descartar", { id }); aviso("Borrador descartado"); verFicha(id); } catch (e) { aviso(e.message); }
  });
}

async function verHistorial(id) {
  const { historial, ficha } = await api("ficha", { id });
  $("#sub").innerHTML = `<div class="tarjeta" style="padding:0"><table class="tabla">
    <thead><tr><th>Versión</th><th>Cuándo</th><th>Quién</th><th>Qué cambió</th><th></th></tr></thead>
    <tbody>${historial.map((v) => `<tr><td><b>v${v.version}</b>${v.version === ficha.version ? ' <span class="suave chico">(activa)</span>' : ""}</td>
      <td>${fecha(v.creado)}</td><td>${esc(v.autor)}</td><td>${esc(v.nota)}</td>
      <td>${v.version !== ficha.version ? `<button data-v="${v.version}">Volver a esta</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="suave">Sin versiones publicadas.</td></tr>`}</tbody>
  </table></div>
  <p class="suave chico">"Volver a esta" la carga como borrador: la probás y la publicás como una versión nueva.</p>`;
  $("#sub tbody").onclick = async (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    try { await api("restaurar", { id, version: Number(b.dataset.v) }); aviso(`v${b.dataset.v} cargada como borrador`); ir(`cliente/${id}/ficha`); } catch (err) { aviso(err.message); }
  };
}

async function verEventos(id) {
  const { eventos } = await api("eventos", { ficha_id: id, dias: 14 });
  $("#sub").innerHTML = `<div class="tarjeta" style="padding:0"><table class="tabla">
    <thead><tr><th>Cuándo</th><th>Qué</th><th>Detalle</th></tr></thead>
    <tbody>${eventos.map((e) => `<tr><td>${fecha(e.creado)}</td><td>${esc(e.tipo)}</td><td class="chico">${esc(e.detalle)}</td></tr>`).join("") || `<tr><td colspan="3" class="suave">Sin eventos en los últimos 14 días.</td></tr>`}</tbody>
  </table></div>`;
}

// ------------------------------------------------------------------ cliente nuevo
async function verNuevo() {
  const opciones = await api("opciones");
  $("#vista").innerHTML = `
    <p><a href="#" class="suave chico">← Todos los clientes</a></p>
    <form class="tarjeta" id="f-nuevo" style="max-width:520px">
      <h2 style="margin-top:0">Cliente nuevo</h2>
      <label>Nombre del negocio</label><input name="nombre" required placeholder="Clínica Sonrisa">
      <label>Id (minúsculas, sin espacios)</label><input name="id" required pattern="[a-z0-9\-]{2,40}" placeholder="clinica-sonrisa">
      <label>Plantilla del rubro</label><select name="plantilla">${opciones.plantillas.map((p) => `<option>${esc(p)}</option>`).join("")}</select>
      <label>Abono mensual (US$)</label><input name="abono" type="number" min="0" step="1" value="200">
      <p class="suave chico">Se crea <b>pausado</b>. Completá la ficha, probala con "Probar borrador", publicala y recién ahí activala.</p>
      <p class="fila"><button class="primario" type="submit">Crear</button></p>
    </form>`;
  const f = $("#f-nuevo");
  f.elements.nombre.oninput = () => { if (!f.elements.id.dataset.tocado) f.elements.id.value = f.elements.nombre.value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40); };
  f.elements.id.oninput = () => (f.elements.id.dataset.tocado = "1");
  f.onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api("crear", { id: f.elements.id.value, nombre: f.elements.nombre.value, plantilla: f.elements.plantilla.value, abono_usd_mes: Number(f.elements.abono.value) });
      aviso("Cliente creado"); ir(`cliente/${r.id}/ficha`);
    } catch (err) { aviso(err.message); }
  };
}

enrutar();
</script>
</body>
</html>
