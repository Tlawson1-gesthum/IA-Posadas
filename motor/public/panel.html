<!doctype html>
<html lang="es" data-tema="presentacion">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PENSA · Central de agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Tema simple (claro u oscuro según el sistema) ---------- */
  :root {
    --fondo: #f4f5f7; --fondo-img: none; --tarjeta: #ffffff; --tarjeta-img: none; --texto: #14161a; --suave: #667085; --borde: #e4e7ec;
    --acento: #2563eb; --acento-txt: #fff; --primario: #2563eb; --resalte: #2563eb;
    --verde: #12b76a; --amarillo: #f79009; --rojo: #f04438; --gris: #98a2b3;
    --cliente: #eef4ff; --agente: #ecfdf3; --humano: #fffaeb; --barra: rgba(255,255,255,.85);
    --sombra: 0 1px 2px rgba(16,24,40,.06); --sombra-hover: 0 8px 24px -12px rgba(16,24,40,.25); --brillo: 0 0 0 transparent;
    --radio: 14px; --titulos: "Space Grotesk", system-ui, sans-serif; --numeros: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="presentacion"]) {
      --fondo: #0f1115; --tarjeta: #171a21; --texto: #e7e9ee; --suave: #98a2b3; --borde: #262b36;
      --acento: #60a5fa; --acento-txt: #0b1220; --primario: #3b82f6; --resalte: #60a5fa;
      --cliente: #16233a; --agente: #13261d; --humano: #2c2412; --barra: rgba(15,17,21,.85);
      --sombra: none; --sombra-hover: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
    }
  }
  /* ---------- Tema de la presentación (siempre oscuro, neón) ---------- */
  :root[data-tema="presentacion"] {
    --fondo: #0c0716; --tarjeta: #181029; --texto: #efeafa; --suave: #a99fc4; --borde: #33244f;
    --fondo-img: radial-gradient(1200px 600px at 80% -10%, #2a1150 0, transparent 60%), radial-gradient(900px 500px at -10% 110%, #0b2a3a 0, transparent 60%);
    --tarjeta-img: linear-gradient(180deg, #20153a, #181029);
    --acento: #22d3ee; --acento-txt: #0c0716; --primario: linear-gradient(135deg, #8b5cf6, #d946ef); --resalte: #22d3ee;
    --verde: #34d399; --amarillo: #fbbf24; --rojo: #fb7185; --gris: #6b5f86;
    --cliente: rgba(34,211,238,.10); --agente: rgba(139,92,246,.16); --humano: rgba(251,191,36,.12); --barra: rgba(12,7,22,.72);
    --sombra: 0 0 0 1px rgba(139,92,246,.06) inset; --sombra-hover: 0 10px 40px -16px #d946ef; --brillo: 0 0 18px -2px currentColor;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  body { margin: 0; min-height: 100vh; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto);
    background: var(--fondo-img), var(--fondo); background-attachment: fixed; -webkit-font-smoothing: antialiased; }
  :root[data-tema="presentacion"] body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35;
    background-image: linear-gradient(rgba(139,92,246,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(139,92,246,.08) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: linear-gradient(180deg, #000, transparent 70%); }
  header.barra, main { position: relative; z-index: 1; }

  header.barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--barra); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--borde); }
  .marca { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .marca .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 15px var(--titulos); color: #fff;
    background: var(--primario); box-shadow: var(--brillo); }
  :root:not([data-tema="presentacion"]) .marca .logo { background: var(--acento); color: var(--acento-txt); }
  .marca h1 { font: 600 17px var(--titulos); letter-spacing: -.01em; margin: 0; }
  .marca small { display: block; font: 500 10px var(--numeros); letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
  header.barra .der { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .temas { display: inline-flex; padding: 3px; border: 1px solid var(--borde); border-radius: 999px; background: var(--tarjeta); }
  .temas button { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 13px; background: none; color: var(--suave); }
  .temas button.on { background: var(--primario); color: #fff; }
  :root:not([data-tema="presentacion"]) .temas button.on { background: var(--acento); color: var(--acento-txt); }

  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  h2 { font: 600 18px var(--titulos); letter-spacing: -.01em; margin: 26px 0 12px; } h3 { font: 600 15px var(--titulos); margin: 16px 0 8px; }
  .etiqueta { font: 500 11px var(--numeros); letter-spacing: .12em; text-transform: uppercase; color: var(--suave); }
  .tarjeta { background: var(--tarjeta-img), var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; box-shadow: var(--sombra); }
  .kpi { transition: transform .15s, box-shadow .15s; }
  .kpi:hover { transform: translateY(-2px); box-shadow: var(--sombra-hover); }
  .kpi b { display: block; font: 700 26px var(--numeros); letter-spacing: -.02em; margin-top: 6px; }
  :root[data-tema="presentacion"] .kpi b { background: linear-gradient(90deg, #efeafa, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kpi.alerta-on { border-color: var(--amarillo); }

  button, .boton { font: inherit; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); border-radius: 10px;
    padding: 7px 13px; cursor: pointer; text-decoration: none; display: inline-block; transition: border-color .15s, box-shadow .15s, transform .1s; }
  button:hover, .boton:hover { border-color: var(--acento); }
  button:active { transform: translateY(1px); }
  button.primario, .boton.primario { background: var(--primario); color: #fff; border-color: transparent; font-weight: 600; }
  :root[data-tema="presentacion"] button.primario:hover, :root[data-tema="presentacion"] .boton.primario:hover { box-shadow: 0 6px 24px -8px #d946ef; }
  button.peligro { color: var(--rojo); border-color: color-mix(in srgb, var(--rojo) 55%, transparent); background: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 8px 10px; width: 100%; }
  :root[data-tema="presentacion"] input, :root[data-tema="presentacion"] select, :root[data-tema="presentacion"] textarea { background: rgba(12,7,22,.6); }
  input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--acento) 60%, transparent); outline-offset: 1px; border-color: var(--acento); }
  textarea { min-height: 90px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  a { color: var(--acento); }
  .suave { color: var(--suave); } .chico { font-size: 13px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 14px; }

  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .verde { background: var(--verde); color: var(--verde); } .amarillo { background: var(--amarillo); color: var(--amarillo); }
  .rojo { background: var(--rojo); color: var(--rojo); } .gris { background: var(--gris); color: var(--gris); }
  .punto.verde, .punto.amarillo, .punto.rojo { box-shadow: var(--brillo); }
  .punto.amarillo, .punto.rojo { animation: latido 1.8s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .45; transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .punto { animation: none !important; } .kpi:hover { transform: none; } }

  .tabla { width: 100%; border-collapse: collapse; }
  .tabla th, .tabla td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  .tabla th { font: 500 11px var(--numeros); color: var(--suave); text-transform: uppercase; letter-spacing: .1em; }
  .tabla tr:last-child td { border-bottom: 0; }
  .tabla tr.click { cursor: pointer; transition: background .12s; } .tabla tr.click:hover { background: color-mix(in srgb, var(--acento) 7%, transparent); }
  .num { text-align: right; font-family: var(--numeros); font-size: 14px; font-variant-numeric: tabular-nums; }
  .neg { color: var(--rojo); font-weight: 700; }
  .barrita { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--suave) 25%, transparent); margin-top: 6px; overflow: hidden; }
  .barrita i { display: block; height: 100%; border-radius: 4px; background: var(--acento); }
  :root[data-tema="presentacion"] .barrita i { background: linear-gradient(90deg, #22d3ee, #8b5cf6, #d946ef); }
  .barrita i.lleno { background: var(--rojo); }

  .alerta { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--tarjeta-img), var(--tarjeta); border: 1px solid var(--borde);
    border-left: 3px solid var(--amarillo); border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: box-shadow .15s; }
  .alerta:hover { box-shadow: var(--sombra-hover); }
  .alerta.error, .alerta.tope_mes { border-left-color: var(--rojo); }
  .pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin: 12px 0 16px; overflow-x: auto; }
  .pestanas button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--suave); }
  .pestanas button.on { border-bottom-color: var(--acento); color: var(--texto); font-weight: 600; }
  .charla { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 14px; }
  .lista-charlas { max-height: 70vh; overflow-y: auto; }
  .item-charla { padding: 11px 12px; border-bottom: 1px solid var(--borde); cursor: pointer; transition: background .12s; }
  .item-charla:hover, .item-charla.sel { background: color-mix(in srgb, var(--acento) 8%, transparent); }
  .mensajes { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid transparent; }
  .msg.cliente { align-self: flex-start; background: var(--cliente); border-bottom-left-radius: 4px; }
  .msg.agente { align-self: flex-end; background: var(--agente); border-bottom-right-radius: 4px; }
  .msg.humano { align-self: flex-end; background: var(--humano); border-bottom-right-radius: 4px; }
  :root[data-tema="presentacion"] .msg.cliente { border-color: rgba(34,211,238,.25); }
  :root[data-tema="presentacion"] .msg.agente { border-color: rgba(139,92,246,.35); }
  :root[data-tema="presentacion"] .msg.humano { border-color: rgba(251,191,36,.3); }
  .msg small { display: block; font: 500 11px var(--numeros); color: var(--suave); margin-top: 4px; }
  .aviso { padding: 11px 14px; border-radius: 12px; background: var(--humano); border: 1px solid color-mix(in srgb, var(--amarillo) 35%, transparent); margin: 8px 0; }
  .problemas { color: var(--rojo); margin: 6px 0; padding-left: 18px; }
  .centro { min-height: 78vh; display: grid; place-items: center; }
  .oculto { display: none !important; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--texto); color: var(--fondo);
    padding: 10px 16px; border-radius: 10px; z-index: 20; max-width: 90vw; box-shadow: var(--sombra-hover); }
  @media (max-width: 760px) {
    .charla { grid-template-columns: 1fr; }
    .tabla .opcional { display: none; }
    .marca small, #cuenta-alertas { display: none; }
    .marca h1 { font-size: 15px; white-space: nowrap; }
    .marca .logo { width: 26px; height: 26px; font-size: 13px; }
    header.barra { padding: 8px 12px; gap: 8px; }
    .temas button { padding: 4px 9px; font-size: 12px; }
    header.barra .der > button { padding: 5px 10px; font-size: 13px; }
    .tabla td, .tabla th { padding: 10px 6px; }
    main { padding: 14px; }
  }
  @media (max-width: 440px) { .marca h1 { display: none; } }
</style>
</head>
<body>
<header class="barra">
  <div class="marca" onclick="ir('')"><span class="logo">P</span><div><h1>Central de agentes</h1><small>PENSA · gobierno</small></div></div>
  <div class="der">
    <span id="cuenta-alertas" class="chico"></span>
    <div class="temas" role="group" aria-label="Tema">
      <button data-tema="simple" onclick="ponerTema('simple')">Simple</button>
      <button data-tema="presentacion" onclick="ponerTema('presentacion')">Futurista</button>
    </div>
    <button class="oculto" id="b-salir" onclick="salir()">Salir</button>
  </div>
</header>
<main id="vista"></main>
<div id="toast" class="oculto"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (n) => "US$ " + Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fecha = (iso) => iso ? new Date(iso).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const hace = (min) => min == null ? "" : min < 60 ? `hace ${min} min` : min < 1440 ? `hace ${Math.round(min / 60)} h` : `hace ${Math.round(min / 1440)} d`;
const nombreCharla = (t) => t.startsWith("web-publico-") ? "Burbuja en la web (cliente)" : t.startsWith("web-borrador-") ? "Prueba de borrador" : t.startsWith("web-") ? "Chat web de prueba" : "+" + t;
const SEMAFORO = { verde: "Funcionando", amarillo: "Con charlas derivadas", rojo: "Con errores o sin saldo", gris: "Pausado" };

function ponerTema(t) {
  document.documentElement.dataset.tema = t;
  try { localStorage.setItem("panel-tema", t); } catch {}
  document.querySelectorAll(".temas button").forEach((b) => b.classList.toggle("on", b.dataset.tema === t));
}
ponerTema((() => { try { return localStorage.getItem("panel-tema"); } catch { return null; } })() || "presentacion");

function aviso(texto) {
  const t = $("#toast"); t.textContent = texto; t.classList.remove("oculto");
  clearTimeout(aviso.t); aviso.t = setTimeout(() => t.classList.add("oculto"), 4000);
}

async function api(accion, datos = {}) {
  const r = await fetch("/api/panel", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ accion, ...datos }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && accion !== "entrar") { mostrarEntrar(); throw new Error(j.error || "Sesión vencida"); }
  if (!r.ok) throw new Error(j.error || "Algo salió mal");
  return j;
}

function ir(ruta) { location.hash = ruta ? "#" + ruta : ""; }
window.addEventListener("hashchange", enrutar);

async function enrutar() {
  const [vista, id, sub] = location.hash.slice(1).split("/");
  try {
    if (vista === "cliente" && id) await verCliente(decodeURIComponent(id), sub || "charlas");
    else if (vista === "nuevo") verNuevo();
    else await verTablero();
    $("#b-salir").classList.remove("oculto");
  } catch (e) { if (!String(e.message).includes("Sesión")) aviso(e.message); }
}

// ------------------------------------------------------------------ entrar
function mostrarEntrar() {
  $("#b-salir").classList.add("oculto"); $("#cuenta-alertas").innerHTML = "";
  $("#vista").innerHTML = `
    <div class="centro"><form class="tarjeta" id="f-entrar" style="width:min(380px,100%);padding:24px">
      <div class="marca" style="margin-bottom:6px"><span class="logo">P</span><div><h1>Central de agentes</h1><small>PENSA · acceso del equipo</small></div></div>
      <label for="clave">Clave del panel</label>
      <input id="clave" type="password" autocomplete="current-password" required autofocus>
      <p class="fila" style="margin-top:14px"><button class="primario" type="submit">Entrar</button></p>
    </form></div>`;
  $("#f-entrar").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("entrar", { clave: $("#clave").value }); enrutar(); } catch (err) { aviso(err.message); }
  };
}
async function salir() { await api("salir").catch(() => {}); mostrarEntrar(); }

// ------------------------------------------------------------------ tablero
async function verTablero() {
  const { clientes, alertas } = await api("tablero");
  const derivadas = alertas.filter((a) => a.tipo === "derivada").length;
  $("#cuenta-alertas").innerHTML = alertas.length ? `<span class="punto rojo"></span> ${alertas.length} alerta${alertas.length > 1 ? "s" : ""}` : "";
  const totalGasto = clientes.reduce((s, c) => s + c.gasto_mes, 0), totalAbono = clientes.filter((c) => c.estado === "activo").reduce((s, c) => s + c.abono_mes, 0);
  $("#vista").innerHTML = `
    <div class="grilla">
      <div class="tarjeta kpi"><div class="etiqueta">Agentes activos</div><b>${clientes.filter((c) => c.estado === "activo").length}<span class="suave" style="font-size:16px"> / ${clientes.length}</span></b></div>
      <div class="tarjeta kpi"><div class="etiqueta">Abonos del mes</div><b>${usd(totalAbono)}</b></div>
      <div class="tarjeta kpi"><div class="etiqueta">Costo de IA del mes</div><b>${usd(totalGasto)}</b></div>
      <div class="tarjeta kpi ${derivadas ? "alerta-on" : ""}"><div class="etiqueta">Esperando a una persona</div><b>${derivadas}</b></div>
    </div>
    <h2>Alertas</h2>
    <div id="alertas">${alertas.length ? alertas.map((a, i) => `
      <div class="alerta ${esc(a.tipo)}" data-i="${i}">
        <div><b>${esc(a.cliente)}</b> · ${a.tipo === "derivada" ? "Charla derivada sin resolver" : a.tipo === "tope_mes" ? "Llegó al tope de gasto" : "Error del agente"}
        <span class="suave chico">${hace(a.minutos)}</span><br><span class="chico">${esc(a.detalle)}</span></div>
      </div>`).join("") : `<p class="suave">Sin alertas. Todo en orden.</p>`}</div>
    <div class="fila" style="justify-content:space-between"><h2>Clientes</h2><button class="primario" onclick="ir('nuevo')">+ Cliente nuevo</button></div>
    <div class="tarjeta" style="padding:0;overflow-x:auto"><table class="tabla">
      <thead><tr><th></th><th>Cliente</th><th class="num">Costo IA / tope</th><th class="num opcional">Abono</th><th class="num">Margen</th>
        <th class="num opcional">Mensajes</th><th class="num opcional">Charlas</th><th></th></tr></thead>
      <tbody>${clientes.map((c) => {
        const margen = c.abono_mes - c.gasto_mes;
        return `<tr class="click" data-id="${esc(c.id)}">
          <td title="${SEMAFORO[c.semaforo]}"><span class="punto ${c.semaforo}"></span></td>
          <td><b>${esc(c.nombre)}</b><div class="suave chico">${esc(c.rubro)} · v${c.version}${c.hay_borrador ? " · borrador sin publicar" : ""}${c.whatsapp ? "" : " · sin WhatsApp"}
            ${c.derivadas_pendientes ? ` · ${c.derivadas_pendientes} derivada(s)` : ""}${c.errores_24h ? ` · ${c.errores_24h} error(es)` : ""}</div></td>
          <td class="num">${usd(c.gasto_mes)} <span class="suave chico">/ ${usd(c.tope_mes)}</span>
            <div class="barrita"><i class="${c.gasto_mes >= c.tope_mes ? "lleno" : ""}" style="width:${Math.min(100, Math.round(c.gasto_mes / (c.tope_mes || 1) * 100))}%"></i></div></td>
          <td class="num opcional">${usd(c.abono_mes)}</td>
          <td class="num ${margen < 0 ? "neg" : ""}">${usd(margen)}</td>
          <td class="num opcional">${c.mensajes_mes}</td>
          <td class="num opcional">${c.charlas_mes}</td>
          <td><button data-estado="${c.estado === "activo" ? "pausado" : "activo"}" data-id="${esc(c.id)}" class="${c.estado === "activo" ? "peligro" : ""}">${c.estado === "activo" ? "Pausar" : "Activar"}</button></td>
        </tr>`;
      }).join("")}</tbody></table></div>
    <p class="suave chico">Margen = abono del mes − costo de IA del mes. No incluye el costo de WhatsApp (Meta) ni el de Vercel o Supabase.</p>`;
  $("#alertas").onclick = (e) => {
    const a = alertas[e.target.closest(".alerta")?.dataset.i];
    if (!a) return;
    verCliente.abrir = a.conversacion_id;
    ir(`cliente/${a.ficha_id}/charlas`);
  };
  $("tbody").onclick = async (e) => {
    const b = e.target.closest("button[data-estado]");
    if (b) {
      e.stopPropagation();
      const pausar = b.dataset.estado === "pausado";
      if (pausar && !confirm("¿Pausar este agente? Deja de responder a todos sus clientes hasta que lo actives.")) return;
      try { await api("estado", { id: b.dataset.id, estado: b.dataset.estado }); aviso(pausar ? "Agente pausado" : "Agente activado"); verTablero(); } catch (err) { aviso(err.message); }
      return;
    }
    const fila = e.target.closest("tr[data-id]");
    if (fila) ir("cliente/" + fila.dataset.id);
  };
}

// ------------------------------------------------------------------ cliente
async function verCliente(id, sub) {
  const { ficha } = await api("ficha", { id });
  const nombre = (ficha.borrador || ficha.config).nombre;
  const tabs = [["charlas", "Charlas"], ["ficha", "Ficha"], ["historial", "Historial"], ["eventos", "Eventos"]];
  $("#vista").innerHTML = `
    <p class="fila"><a href="#" class="suave chico">← Todos los clientes</a></p>
    <div class="fila" style="justify-content:space-between">
      <h2 style="margin:6px 0">${esc(nombre)} <span class="suave chico">(${esc(ficha.id)} · v${ficha.version} · ${ficha.estado})</span></h2>
      <a class="boton" target="_blank" rel="noopener" href="/?ficha=${encodeURIComponent(ficha.id)}">Probar el agente</a>
    </div>
    <nav class="pestanas">${tabs.map(([k, t]) => `<button class="${k === sub ? "on" : ""}" onclick="ir('cliente/${esc(ficha.id)}/${k}')">${t}</button>`).join("")}</nav>
    <div id="sub"></div>`;
  if (sub === "ficha") return verFicha(id);
  if (sub === "historial") return verHistorial(id);
  if (sub === "eventos") return verEventos(id);
  return verCharlas(id);
}

async function verCharlas(fichaId) {
  const sub = $("#sub");
  sub.innerHTML = `<div class="charla">
    <div class="tarjeta" style="padding:0">
      <div class="fila" style="padding:10px"><label class="fila" style="margin:0;color:var(--texto)"><input type="checkbox" id="solo-der" style="width:auto"> Solo derivadas</label></div>
      <div class="lista-charlas" id="lista"></div>
    </div>
    <div class="tarjeta" id="detalle"><p class="suave">Elegí una charla.</p></div>
  </div>`;
  const cargar = async () => {
    const { conversaciones } = await api("conversaciones", { ficha_id: fichaId, solo_derivadas: $("#solo-der").checked });
    $("#lista").innerHTML = conversaciones.length ? conversaciones.map((c) => `
      <div class="item-charla" data-id="${c.id}">
        <div class="fila"><span class="punto ${c.estado === "humano" ? "amarillo" : "verde"}"></span><b>${esc(nombreCharla(c.telefono))}</b></div>
        <div class="chico">${esc((c.ultimo_texto || "").slice(0, 80))}</div>
        <div class="suave chico">${fecha(c.ultimo_creado || c.actualizada)} · ${c.mensajes} msj · ${usd(c.usd)}</div>
      </div>`).join("") : `<p class="suave" style="padding:10px">No hay charlas.</p>`;
    if (verCliente.abrir) { abrirCharla(verCliente.abrir); verCliente.abrir = null; }
  };
  $("#solo-der").onchange = cargar;
  $("#lista").onclick = (e) => { const it = e.target.closest(".item-charla"); if (it) abrirCharla(it.dataset.id); };
  await cargar();
}

async function abrirCharla(id) {
  document.querySelectorAll(".item-charla").forEach((x) => x.classList.toggle("sel", x.dataset.id === id));
  const { conversacion: c, mensajes } = await api("conversacion", { id });
  const esWeb = c.telefono.startsWith("web-");
  $("#detalle").innerHTML = `
    <div class="fila" style="justify-content:space-between">
      <b>${esc(nombreCharla(c.telefono))}</b>
      ${c.estado === "humano" ? `<button class="primario" id="b-liberar">Devolver al agente</button>` : `<span class="suave chico">La atiende el agente</span>`}
    </div>
    ${c.estado === "humano" ? `<div class="aviso"><b>Derivada</b> ${hace(Math.round((Date.now() - Date.parse(c.derivada_en)) / 60000))}: ${esc(c.derivada_motivo)} — ${esc(c.derivada_resumen)}<br>
      <span class="chico">El agente no responde hasta que la devuelvas.</span></div>` : ""}
    <div class="mensajes" id="msjs">${mensajes.map((m) => `
      <div class="msg ${m.rol}">${esc(m.texto)}<small>${m.rol === "humano" ? "Persona del equipo · " : ""}${fecha(m.creado)}${m.herramientas?.length ? " · " + esc(m.herramientas.join(", ")) : ""}${m.usd ? " · " + usd(m.usd) : ""}</small></div>`).join("")}</div>
    ${c.telefono.startsWith("web-") && !c.telefono.startsWith("web-publico-") ? `<p class="suave chico">Charla del chat de prueba: no se le puede escribir desde acá.</p>` : `
    <form id="f-resp" style="margin-top:10px">
      <label for="resp">Responder como persona del equipo (${esWeb ? "le aparece en el chat de la web si lo tiene abierto" : "le llega por WhatsApp"}; la charla queda en tus manos)</label>
      <textarea id="resp" rows="3" required></textarea>
      <p class="fila"><button class="primario" type="submit">Enviar</button></p>
    </form>`}`;
  const msjs = $("#msjs"); msjs.scrollTop = msjs.scrollHeight;
  $("#b-liberar")?.addEventListener("click", async () => {
    try { await api("liberar", { id }); aviso("La charla volvió al agente"); abrirCharla(id); } catch (e) { aviso(e.message); }
  });
  $("#f-resp")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    try { await api("responder", { id, texto: $("#resp").value }); aviso("Mensaje enviado"); abrirCharla(id); } catch (err) { aviso(err.message); }
  });
}

async function verFicha(id) {
  const d = await api("ficha", { id });
  const f = d.ficha, c = structuredClone(f.borrador || f.config), o = d.opciones;
  const campos = [...new Set([...o.campos, ...Object.keys(c.datos || {})])];
  const lim = { ...o.limites, ...(c.limites || {}) };
  $("#sub").innerHTML = `
    ${f.borrador ? `<div class="aviso">Hay <b>cambios sin publicar</b>. El agente sigue usando la v${f.version} hasta que publiques.</div>` : ""}
    ${d.problemas.length ? `<ul class="problemas">${d.problemas.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    <form id="f-ficha">
      <div class="tarjeta">
        <h3 style="margin-top:0">Datos generales</h3>
        <div class="grilla">
          <div><label>Nombre del negocio</label><input name="nombre" value="${esc(c.nombre)}"></div>
          <div><label>Rubro</label><input name="rubro" value="${esc(c.rubro)}"></div>
          <div><label>Plantilla</label><select name="plantilla">${o.plantillas.map((p) => `<option ${p === c.plantilla ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>
          <div><label>Modelo</label><select name="modelo">${o.modelos.map((m) => `<option ${m === c.modelo ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></div>
          <div><label>Esfuerzo</label><select name="esfuerzo">${["low", "medium", "high"].map((m) => `<option ${m === c.esfuerzo ? "selected" : ""}>${m}</option>`).join("")}</select></div>
          <div><label>Tope de gasto mensual (US$)</label><input name="tope_usd_mes" type="number" min="1" step="1" value="${esc(c.tope_usd_mes)}"></div>
        </div>
        <h3>Límites por persona</h3>
        <div class="grilla">
          <div><label>Mensajes por hora</label><input name="lim_mensajes_por_hora" type="number" min="1" value="${lim.mensajes_por_hora}"></div>
          <div><label>Mensajes por día</label><input name="lim_mensajes_por_dia" type="number" min="1" value="${lim.mensajes_por_dia}"></div>
          <div><label>Gasto por persona por día (US$)</label><input name="lim_usd_por_persona_dia" type="number" min="0.05" step="0.05" value="${lim.usd_por_persona_dia}"></div>
          <div><label>Largo máximo del mensaje</label><input name="lim_caracteres_por_mensaje" type="number" min="100" value="${lim.caracteres_por_mensaje}"></div>
        </div>
        <h3>Herramientas</h3>
        ${o.herramientas.map((h) => `<label class="fila" style="color:var(--texto);align-items:flex-start"><input type="checkbox" name="herr" value="${esc(h.nombre)}" style="width:auto;margin-top:3px" ${c.herramientas?.includes(h.nombre) ? "checked" : ""}>
          <span><b>${esc(h.nombre)}</b><br><span class="suave chico">${esc(h.descripcion)}</span></span></label>`).join("")}
        <h3>Conocimiento en vivo</h3>
        <label>Dirección de un texto que el agente lee siempre actualizado (por ejemplo, el manual del sistema). Va en {{conocimiento}} de la plantilla.</label>
        <input name="conocimiento_url" value="${esc(c.conocimiento?.url || "")}" placeholder="https://.../api/ayuda">
        <h3>Integración con el sistema del cliente</h3>
        <div class="grilla">
          <div><label>Tipo</label><input name="int_tipo" value="${esc(c.integracion?.tipo || "")}" placeholder="ej. semorfa"></div>
          <div><label>Dirección (base_url)</label><input name="int_base_url" value="${esc(c.integracion?.base_url || "")}" placeholder="https://..."></div>
          <div><label>Clave (nombre de la variable en Vercel)</label><input name="int_clave" value="${esc(c.integracion?.clave_env || "")}" placeholder="ej. SEMORFA_AGENTE_CLAVE"></div>
          <div><label class="fila" style="color:var(--texto);margin-top:30px"><input type="checkbox" name="int_crear" style="width:auto" ${c.integracion?.crear_pedidos ? "checked" : ""}> Crear pedidos de verdad</label></div>
          <div><label>Pagos que puede cobrar el agente</label>
            ${["mercadopago", "efectivo"].map((pg) => `<label class="fila" style="color:var(--texto);margin:4px 0"><input type="checkbox" name="int_pago" value="${pg}" style="width:auto" ${(c.integracion?.pagos_agente ?? ["efectivo", "mercadopago"]).includes(pg) ? "checked" : ""}> ${pg === "mercadopago" ? "Mercado Pago" : "Efectivo"}</label>`).join("")}</div>
        </div>
      </div>
      <div class="tarjeta" style="margin-top:12px">
        <h3 style="margin-top:0">Qué sabe y cómo habla</h3>
        <p class="suave chico">Cada campo completa la plantilla <b>${esc(c.plantilla)}</b>.</p>
        ${campos.map((k) => `<label>${esc(k.replace(/_/g, " "))}</label><textarea name="dato_${esc(k)}" rows="${Math.min(14, Math.max(3, String(c.datos?.[k] || "").split("\n").length + 1))}">${esc(c.datos?.[k] || "")}</textarea>`).join("")}
      </div>
      <div class="tarjeta" style="margin-top:12px">
        <h3 style="margin-top:0">Chat en la web del cliente (burbuja)</h3>
        <label class="fila" style="color:var(--texto)"><input type="checkbox" name="cw_activo" style="width:auto" ${c.chat_web?.activo ? "checked" : ""}> Mostrar la burbuja en su web</label>
        <div class="grilla">
          <div><label>Color</label><input name="cw_color" type="color" value="${esc(c.chat_web?.color || "#2563eb")}" style="height:40px;padding:4px"></div>
          <div><label>Mensajes por hora por conexión</label><input name="cw_ip" type="number" min="1" value="${c.chat_web?.mensajes_por_ip_hora ?? 20}"></div>
          <div><label>Tope de mensajes por día (todo el chat)</label><input name="cw_dia" type="number" min="10" value="${c.chat_web?.mensajes_por_dia ?? 400}"></div>
        </div>
        <label>Saludo al abrir (no gasta: no lo escribe la IA)</label>
        <input name="cw_saludo" value="${esc(c.chat_web?.saludo || "")}" placeholder="¡Hola! ¿Qué se te antoja hoy?">
        <label>Código para pegar en su web (una sola vez, antes de &lt;/body&gt;)</label>
        <textarea readonly rows="2" onclick="this.select()" style="font-family:var(--numeros);font-size:12px">&lt;script src="${location.origin}/widget.js" data-ficha="${esc(f.id)}" defer&gt;&lt;/script&gt;</textarea>
        <p class="suave chico">Se prende y apaga desde acá (al publicar). Con la burbuja apagada, el código no muestra nada. Para verla antes de activarla: <a target="_blank" rel="noopener" href="/widget.html?ficha=${encodeURIComponent(f.id)}">abrí la ventana del chat</a> (solo anda con la ficha publicada y activa).</p>
      </div>
      <div class="tarjeta" style="margin-top:12px">
        <h3 style="margin-top:0">Contrato y WhatsApp <span class="suave chico">(se guardan al instante, no van al borrador)</span></h3>
        <div class="grilla">
          <div><label>Abono mensual (US$)</label><input name="abono" type="number" min="0" step="1" value="${f.abono_usd_mes}"></div>
          <div><label>Phone number ID de Meta</label><input name="wa" value="${esc(f.whatsapp_phone_number_id || "")}" inputmode="numeric"></div>
        </div>
      </div>
      <p class="fila" style="margin-top:14px">
        <button class="primario" type="submit">Guardar borrador</button>
        ${f.borrador ? `<a class="boton" target="_blank" rel="noopener" href="/?ficha=${encodeURIComponent(f.id)}&borrador=1">Probar borrador</a>
        <button type="button" id="b-publicar" class="primario">Publicar</button>
        <button type="button" id="b-descartar" class="peligro">Descartar borrador</button>` : ""}
      </p>
    </form>`;
  const form = $("#f-ficha");
  form.onsubmit = async (e) => {
    e.preventDefault();
    const v = (n) => form.elements[n].value;
    const nueva = {
      ...c,
      nombre: v("nombre").trim(), rubro: v("rubro").trim(), plantilla: v("plantilla"), modelo: v("modelo"), esfuerzo: v("esfuerzo"),
      tope_usd_mes: Number(v("tope_usd_mes")),
      limites: { mensajes_por_hora: Number(v("lim_mensajes_por_hora")), mensajes_por_dia: Number(v("lim_mensajes_por_dia")),
        usd_por_persona_dia: Number(v("lim_usd_por_persona_dia")), caracteres_por_mensaje: Number(v("lim_caracteres_por_mensaje")) },
      herramientas: [...form.querySelectorAll("input[name=herr]:checked")].map((x) => x.value),
      datos: Object.fromEntries(campos.map((k) => [k, form.elements["dato_" + k].value])),
    };
    if (v("int_base_url").trim()) nueva.integracion = { ...(c.integracion || {}), tipo: v("int_tipo").trim(), base_url: v("int_base_url").trim(), crear_pedidos: form.elements.int_crear.checked, clave_env: v("int_clave").trim() || undefined,
      pagos_agente: [...form.querySelectorAll("input[name=int_pago]:checked")].map((x) => x.value) };
    else delete nueva.integracion;
    if (v("conocimiento_url").trim()) nueva.conocimiento = { url: v("conocimiento_url").trim() };
    else delete nueva.conocimiento;
    nueva.chat_web = { activo: form.elements.cw_activo.checked, color: v("cw_color"), saludo: v("cw_saludo").trim(),
      mensajes_por_ip_hora: Number(v("cw_ip")) || 20, mensajes_por_dia: Number(v("cw_dia")) || 400 };
    try {
      const r = await api("guardar", { id, config: nueva, abono_usd_mes: Number(v("abono")), whatsapp_phone_number_id: v("wa") });
      aviso(r.problemas.length ? "Borrador guardado, pero hay cosas para corregir" : "Borrador guardado. Probalo y publicalo.");
      verFicha(id);
    } catch (err) { aviso(err.message); }
  };
  $("#b-publicar")?.addEventListener("click", async () => {
    const nota = prompt("¿Qué cambiaste? (queda en el historial)");
    if (!nota) return;
    try { const r = await api("publicar", { id, nota }); aviso(`Publicada la v${r.version}`); verCliente(id, "ficha"); } catch (e) { aviso(e.message); }
  });
  $("#b-descartar")?.addEventListener("click", async () => {
    if (!confirm("¿Descartar todos los cambios sin publicar?")) return;
    try { await api("descartar", { id }); aviso("Borrador descartado"); verFicha(id); } catch (e) { aviso(e.message); }
  });
}

async function verHistorial(id) {
  const { historial, ficha } = await api("ficha", { id });
  $("#sub").innerHTML = `<div class="tarjeta" style="padding:0"><table class="tabla">
    <thead><tr><th>Versión</th><th>Cuándo</th><th>Quién</th><th>Qué cambió</th><th></th></tr></thead>
    <tbody>${historial.map((v) => `<tr><td><b>v${v.version}</b>${v.version === ficha.version ? ' <span class="suave chico">(activa)</span>' : ""}</td>
      <td>${fecha(v.creado)}</td><td>${esc(v.autor)}</td><td>${esc(v.nota)}</td>
      <td>${v.version !== ficha.version ? `<button data-v="${v.version}">Volver a esta</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="suave">Sin versiones publicadas.</td></tr>`}</tbody>
  </table></div>
  <p class="suave chico">"Volver a esta" la carga como borrador: la probás y la publicás como una versión nueva.</p>`;
  $("#sub tbody").onclick = async (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    try { await api("restaurar", { id, version: Number(b.dataset.v) }); aviso(`v${b.dataset.v} cargada como borrador`); ir(`cliente/${id}/ficha`); } catch (err) { aviso(err.message); }
  };
}

async function verEventos(id) {
  const { eventos } = await api("eventos", { ficha_id: id, dias: 14 });
  $("#sub").innerHTML = `<div class="tarjeta" style="padding:0"><table class="tabla">
    <thead><tr><th>Cuándo</th><th>Qué</th><th>Detalle</th></tr></thead>
    <tbody>${eventos.map((e) => `<tr><td>${fecha(e.creado)}</td><td>${esc(e.tipo)}</td><td class="chico">${esc(e.detalle)}</td></tr>`).join("") || `<tr><td colspan="3" class="suave">Sin eventos en los últimos 14 días.</td></tr>`}</tbody>
  </table></div>`;
}

// ------------------------------------------------------------------ cliente nuevo
async function verNuevo() {
  const opciones = await api("opciones");
  $("#vista").innerHTML = `
    <p><a href="#" class="suave chico">← Todos los clientes</a></p>
    <form class="tarjeta" id="f-nuevo" style="max-width:520px">
      <h2 style="margin-top:0">Cliente nuevo</h2>
      <label>Nombre del negocio</label><input name="nombre" required placeholder="Clínica Sonrisa">
      <label>Id (minúsculas, sin espacios)</label><input name="id" required pattern="[a-z0-9\-]{2,40}" placeholder="clinica-sonrisa">
      <label>Plantilla del rubro</label><select name="plantilla">${opciones.plantillas.map((p) => `<option>${esc(p)}</option>`).join("")}</select>
      <label>Abono mensual (US$)</label><input name="abono" type="number" min="0" step="1" value="200">
      <p class="suave chico">Se crea <b>pausado</b>. Completá la ficha, probala con "Probar borrador", publicala y recién ahí activala.</p>
      <p class="fila"><button class="primario" type="submit">Crear</button></p>
    </form>`;
  const f = $("#f-nuevo");
  f.elements.nombre.oninput = () => { if (!f.elements.id.dataset.tocado) f.elements.id.value = f.elements.nombre.value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40); };
  f.elements.id.oninput = () => (f.elements.id.dataset.tocado = "1");
  f.onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api("crear", { id: f.elements.id.value, nombre: f.elements.nombre.value, plantilla: f.elements.plantilla.value, abono_usd_mes: Number(f.elements.abono.value) });
      aviso("Cliente creado"); ir(`cliente/${r.id}/ficha`);
    } catch (err) { aviso(err.message); }
  };
}

enrutar();
</script>
