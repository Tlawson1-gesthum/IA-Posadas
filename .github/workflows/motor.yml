# Pruebas del motor de agentes en cada cambio a la rama distribuidoras (paso 30).
# Sin Claude, sin Meta y sin Supabase: tipos, pruebas unitarias (almacén en memoria) y claves pegadas en el código.
name: Motor

on:
  pull_request:
    branches: [distribuidoras]
    paths: ["motor/**", ".github/workflows/motor.yml"]
  push:
    branches: [distribuidoras]
    paths: ["motor/**", ".github/workflows/motor.yml"]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run tipos
      - name: Pruebas unitarias
        run: npm run unidad
      - name: Claves pegadas en el código (gitleaks)
        working-directory: .
        run: |
          RANGO="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
          case "$RANGO" in 0000000*) RANGO="${{ github.sha }}~1..${{ github.sha }}";; esac
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 git /repo --redact --no-banner --log-opts="$RANGO"
# prueba de las pruebas automáticas (rama prueba-ci, no se mergea)
